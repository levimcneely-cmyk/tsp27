<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TSP">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>TSP — Race HQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  (function(){ try{
    var p=localStorage.getItem('tsp_theme_v1')||'auto', h=new Date().getHours();
    var dark=p==='dark'||(p==='auto'&&(h>=19||h<6));
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  }catch(e){} })();
</script>
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Brand — sampled from the TSP logos */
    --blue: #125db9;
    --blue-dark: #0b4389;
    --blue-tint: rgba(18,93,185,0.08);
    --blue-line: rgba(18,93,185,0.35);
    --gray: #8f8f8f;
    --gray-tint: #efefef;
    --ink: #000000;
    --ink-dim: #5f5f5f;
    --ink-faint: #9b9b9b;
    --paper: #ffffff;
    --paper2: #f6f6f4;
    --line: rgba(0,0,0,0.10);
    --line-strong: rgba(0,0,0,0.22);
    --red: #c8312b;
    --green: #1f8a4c;
    --on-ink: #ffffff;        /* text on solid ink (black) backgrounds */
    --duct-gray: #c9c9c9;
    --duct-label: #b3b3b3;
    --check-ink: #000000;
    --display: 'Londrina Solid', 'Arial Black', sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
    --marker: 'Permanent Marker', 'Comic Sans MS', cursive;   /* black Sharpie */
    /* Torn tape: long edges stay straight, only the ends are ripped (fixed depth so it reads the same at any width) */
    /* Torn tape: long edges stay straight; only the ends are ripped — shallow, irregular fibers (not zigzags) */
    --torn: polygon(2px 0, calc(100% - 3px) 0, calc(100% - 1px) 11%, 100% 19%, calc(100% - 2px) 34%, calc(100% - 1px) 41%, 100% 58%, calc(100% - 3px) 66%, calc(100% - 1px) 79%, calc(100% - 2px) 100%, 3px 100%, 1px 88%, 0 76%, 2px 63%, 1px 49%, 3px 37%, 0 24%, 1px 9%);
    --torn-wide: polygon(3px 0, calc(100% - 2px) 0, 100% 7%, calc(100% - 3px) 15%, calc(100% - 1px) 26%, calc(100% - 4px) 33%, calc(100% - 2px) 47%, 100% 55%, calc(100% - 3px) 68%, calc(100% - 1px) 77%, calc(100% - 4px) 89%, calc(100% - 2px) 100%, 4px 100%, 1px 93%, 3px 82%, 0 71%, 2px 60%, 4px 52%, 1px 40%, 3px 28%, 0 17%, 2px 6%);
    --torn-thin: polygon(1px 0, calc(100% - 3px) 0, 100% 40%, calc(100% - 2px) 70%, calc(100% - 4px) 100%, 3px 100%, 0 65%, 2px 30%);
    /* Blue painter's tape — matte crepe: faint, irregular fibers across the tape */
    --painters: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px, rgba(0,0,0,0.03) 4px 5px, transparent 5px 9px);
    /* Gray duct tape — soft woven cloth + a little sheen */
    --duct: repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 4px),
            repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 4px),
            linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0) 50%, rgba(0,0,0,0.08));
  }
  .marker { font-family: var(--marker); font-weight: 400; letter-spacing: .02em; text-transform: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .header {
    padding-top: env(safe-area-inset-top);
    background: var(--paper);
    position: relative;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 12px 24px 10px;
  }
  .header-logo { display: flex; align-items: center; padding-right: 22px; }
  .header-logo img { height: 64px; width: auto; display: block; }
  .header-meta {
    padding: 4px 18px;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    border-left: 2px solid var(--gray-tint);
  }
  .header-meta-label {
    font-family: var(--mono); font-size: 8px; letter-spacing: .14em; color: var(--gray);
  }
  .header-meta-val {
    font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .02em;
    color: var(--blue); line-height: 1;
  }
  .header-status { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .status-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--blue); font-weight: 700; }
  .header-status.pre .status-dot, .header-status.post .status-dot { display: none; }
  .header-status.pre .status-label, .header-status.post .status-label { font-family: var(--marker); font-size: 18px; letter-spacing: .02em; font-weight: 400; color: var(--ink); }
  /* gray tape strip under the header, echoing the strips under T-S-P */
  .header::after {
    content: '';
    display: block;
    height: 12px;
    margin: 0 16px;
    background-color: var(--gray);
    background-image: var(--duct);
    clip-path: var(--torn-thin);
  }

  /* ---------- Nav — fixed bottom tab bar on mobile ---------- */
  nav {
    display: flex;
    background: var(--paper);
    border-top: 2px solid var(--ink);
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; font-weight: 700;
    padding: 12px 6px 10px;
    background: transparent; border: none;
    color: var(--ink-faint);
    cursor: pointer; position: relative;
    transition: color .2s;
    white-space: nowrap; min-height: 48px;
  }
  nav button::after {
    content: '';
    position: absolute; top: -2px; left: 10%; right: 10%;
    height: 6px;
    background-color: var(--blue);
    background-image: var(--painters);
    clip-path: var(--torn-thin);
    transform: scaleX(0); transition: transform .2s;
  }
  nav button.active { color: var(--blue); }
  nav button.active::after { transform: scaleX(1); }
  nav button:hover:not(.active) { color: var(--ink); }
  @media (min-width: 601px) {
    nav {
      position: sticky; top: 0; bottom: auto;
      border-top: none; border-bottom: 2px solid var(--gray-tint);
    }
    nav button { flex: none; padding: 14px 24px; font-size: 11px; }
    nav button::after { top: auto; bottom: -2px; }
    body { padding-bottom: 0; }
  }

  /* ---------- Pages ---------- */
  .page { display: none; padding: 24px; }
  .page.active { display: block; }

  /* ---------- Stat grid ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
    margin-bottom: 20px;
  }
  .stat-cell {
    background: var(--paper2);
    padding: 14px 16px;
    position: relative;
  }
  .stat-cell-label {
    font-family: var(--mono); font-size: 8px; letter-spacing: .14em;
    color: var(--ink-dim); margin-bottom: 6px; text-transform: uppercase;
  }
  .stat-cell-val {
    font-family: var(--display); font-weight: 900; font-size: 32px; letter-spacing: .01em;
    line-height: 1; color: var(--ink);
  }
  .stat-cell-sub { font-family: var(--mono); font-size: 9px; color: var(--ink-dim); margin-top: 4px; }
  .stat-cell.highlight { background-color: var(--blue); background-image: var(--painters); clip-path: var(--torn); }
  .stat-cell.highlight .stat-cell-val,
  .stat-cell.highlight .stat-cell-label,
  .stat-cell.highlight .stat-cell-sub { color: #fff; }

  /* ---------- Progress (the route line) ---------- */
  .progress-wrap { margin-bottom: 20px; position: relative; }
  .progress-meta {
    display: flex; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
    color: var(--ink-dim); margin-bottom: 6px;
  }
  .progress-track {
    height: 12px;
    background-color: var(--duct-gray);
    background-image: var(--duct);
    position: relative; overflow: hidden;
    clip-path: var(--torn-thin);
  }
  .progress-fill { height: 100%; background-color: var(--blue); background-image: var(--painters); position: relative; transition: width .6s ease; opacity: .92; }

  /* Route map — the logo's Sharpie line, with painter's tape over the miles run */
  .route-wrap { margin-bottom: 18px; }
  .route-svg { display: block; width: 100%; max-height: 260px; margin: 2px auto 0; overflow: visible; }
  .route-ink  { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .route-tape { fill: none; stroke: var(--blue); stroke-width: 20; stroke-linecap: butt; stroke-linejoin: round; opacity: .82; }
  .route-end  { font-family: var(--marker); font-size: 44px; fill: var(--gray); }
  .route-dot  { stroke: var(--paper); stroke-width: 5; }
  .route-meta { text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-dim); margin-top: 4px; }
  .route-meta strong { color: var(--blue); }

  /* ---------- Now running ---------- */
  .now-card {
    border: 3px solid var(--blue);
    background: var(--paper);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .now-card::before {
    content: 'now running';
    position: absolute; top: 0; right: 0;
    font-family: var(--marker); font-size: 15px; letter-spacing: .02em;
    color: #111; background-color: var(--duct-label); background-image: var(--duct);
    padding: 4px 14px 3px 16px;
    clip-path: var(--torn);
  }
  .now-runner-name {
    font-family: var(--display); font-weight: 900; font-size: 56px; letter-spacing: .01em;
    line-height: .95; color: var(--blue); margin-bottom: 6px;
  }
  .now-leg-info {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    color: var(--ink-dim); margin-bottom: 14px; line-height: 1.6;
  }
  .now-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .now-stat-label {
    font-family: var(--mono); font-size: 8px; letter-spacing: .12em;
    color: var(--ink-dim); margin-bottom: 3px; text-transform: uppercase;
  }
  .now-stat-val {
    font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .01em;
    color: var(--ink); line-height: 1;
  }

  /* ---------- On deck ---------- */
  .deck-card {
    border: 2px solid var(--line-strong);
    background: var(--paper);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .deck-label {
    font-family: var(--marker); font-size: 14px; letter-spacing: .01em;
    color: var(--ink-dim); margin-bottom: 2px;
  }
  .deck-name {
    font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: .01em;
    color: var(--ink); line-height: 1;
  }
  .deck-info { font-family: var(--mono); font-size: 9px; color: var(--ink-dim); text-align: right; }
  .deck-info strong { display: block; font-size: 15px; color: var(--ink); font-weight: 700; margin-bottom: 2px; }

  /* ---------- Runner grid ---------- */
  .runner-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .runner-cell {
    background: var(--paper2);
    padding: 12px 14px;
    border: 2px solid transparent;
    position: relative;
  }
  .runner-cell.is-next { border-color: var(--blue); background: var(--paper); }
  .runner-cell-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .av {
    width: 30px; height: 30px;
    border: 2px solid var(--blue);
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 900; font-size: 13px; letter-spacing: .02em;
    color: var(--blue); flex-shrink: 0;
  }
  .runner-name-cell {
    font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .01em;
    color: var(--ink); line-height: 1;
  }
  .runner-stats-cell { font-family: var(--mono); font-size: 9px; color: var(--ink-dim); line-height: 1.6; }
  .runner-miles-cell { font-family: var(--mono); font-size: 10px; color: var(--blue); font-weight: 700; margin-top: 3px; }

  /* ---------- Section header — blue tape ---------- */
  .section-head {
    display: inline-block;
    background-color: var(--blue);
    background-image: var(--painters);
    color: #fff;
    font-family: var(--display); font-weight: 900;
    font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
    line-height: 1;
    padding: 6px 18px 5px 14px;
    margin-bottom: 12px;
    clip-path: var(--torn);
  }

  /* ---------- Tables ---------- */
  .tbl-wrap { border: 2px solid var(--ink); overflow: hidden; background: var(--paper); }
  .tbl-scroll { max-height: 440px; overflow: auto; -webkit-overflow-scrolling: touch; }
  .tbl-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .tbl-scroll::-webkit-scrollbar-track { background: var(--paper2); }
  .tbl-scroll::-webkit-scrollbar-thumb { background: var(--blue); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  thead th {
    background: var(--ink);
    padding: 9px 10px;
    text-align: left;
    font-family: var(--mono); font-size: 8px; letter-spacing: .14em;
    color: var(--on-ink); text-transform: uppercase; font-weight: 400;
    position: sticky; top: 0; z-index: 2;
  }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
    vertical-align: middle;
  }
  tbody tr:hover td { background: var(--blue-tint); color: var(--ink); }
  tbody tr.is-current td { background: var(--blue-tint); color: var(--ink); }
  tbody tr.is-current td:first-child { box-shadow: inset 4px 0 0 var(--blue); }
  tbody tr.is-done { opacity: .35; }
  tbody td .btn-ghost { padding: 5px 7px; min-height: 30px; font-size: 9px; letter-spacing: .04em; }
  .pace-val { font-family: var(--mono); font-weight: 700; color: var(--ink); font-size: 11px; }

  /* ---------- Tags ---------- */
  .tag {
    display: inline-block; padding: 2px 7px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em; border: 1px solid;
  }
  .tag-night  { border-color: var(--ink); color: var(--on-ink); background: var(--ink); }
  .tag-heat   { border-color: rgba(200,49,43,0.5); color: var(--red); background: rgba(200,49,43,0.06); }
  .tag-dawn   { border-color: var(--blue-line); color: var(--blue); background: var(--blue-tint); }
  .tag-normal { border-color: var(--line-strong); color: var(--ink-dim); }

  .diff-pos { font-family: var(--mono); font-size: 10px; color: var(--red); font-weight: 700; }
  .diff-neg { font-family: var(--mono); font-size: 10px; color: var(--green); font-weight: 700; }
  .diff-ok  { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .ahead-line { font-size: 14px !important; margin-top: 10px; }
  .actual-tbl .col-n { width: 28px; } .actual-tbl .col-runner { width: 96px; } .actual-tbl .col-clock { width: 64px; }
  .actual-tbl .col-mi { width: 46px; } .actual-tbl .col-pace { width: 70px; } .actual-tbl .col-time { width: 54px; } .actual-tbl .col-diff { width: 78px; }
  @media (max-width: 600px) {
    .actual-tbl th, .actual-tbl td { padding-left: 5px; padding-right: 5px; }
    .actual-tbl .col-clock, .actual-tbl .col-rname { display: none; }
    .actual-tbl .col-n { width: 20px; } .actual-tbl .col-runner { width: 34px; }
    .actual-tbl .col-mi { width: 30px; } .actual-tbl .col-pace { width: 66px; } .actual-tbl .col-time { width: 42px; } .actual-tbl .col-diff { width: 72px; }
    .actual-tbl .pace-val, .actual-tbl .diff-pos, .actual-tbl .diff-neg, .actual-tbl .diff-ok { font-size: 10px; }
  }

  /* ---------- Forms ---------- */
  .form-card {
    background: var(--paper2);
    border: 2px solid var(--line);
    padding: 20px;
    margin-bottom: 16px;
  }
  .form-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
  .form-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; font-weight: 700;
    color: var(--blue); text-transform: uppercase; margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    background: var(--paper);
    border: 2px solid var(--line-strong);
    color: var(--ink);
    font-family: var(--mono); font-size: 16px;
    padding: 10px 12px;
    outline: none; transition: border-color .2s;
    min-height: 44px; border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
    padding-right: 30px;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); }
  select option { background: var(--paper); }

  .btn {
    font-family: var(--display); font-weight: 900;
    font-size: 20px; letter-spacing: .06em; line-height: 1;
    padding: 12px 30px 11px;
    min-height: 46px;
    background-color: var(--blue); background-image: var(--painters); color: #fff;
    border: none; cursor: pointer;
    position: relative;
    clip-path: var(--torn);
    transition: background .15s, transform .1s;
  }
  .btn:hover { background-color: var(--blue-dark); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { background-color: var(--gray); cursor: default; }
  .btn-ghost {
    background: var(--paper);
    border: 2px solid var(--line-strong);
    color: var(--ink-dim);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; font-weight: 700;
    padding: 7px 12px; min-height: 36px;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--red); color: var(--red); }

  #log-msg { font-family: var(--mono); font-size: 11px; margin-left: 12px; }

  .hint-box {
    background: var(--blue-tint);
    border-left: 5px solid var(--blue);
    padding: 10px 14px;
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-dim);
    margin-bottom: 14px; line-height: 1.7;
  }
  .hint-box strong { color: var(--blue); }

  /* ---------- Actual page ---------- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .info-block { background: var(--paper2); padding: 16px; }
  .info-block-label {
    font-family: var(--mono); font-size: 8px; letter-spacing: .14em; font-weight: 700;
    color: var(--blue); text-transform: uppercase; margin-bottom: 8px;
  }
  .info-block-big { font-family: var(--display); font-weight: 900; font-size: 40px; color: var(--ink); line-height: 1; }
  .info-block-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); margin-top: 4px; }
  .runner-split-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .runner-split-row:last-child { border-bottom: none; }
  .runner-split-left { display: flex; align-items: center; gap: 8px; }
  .runner-split-name { font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--ink); }
  .runner-split-right { text-align: right; font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .runner-split-right strong { color: var(--blue); display: block; font-size: 13px; margin-bottom: 1px; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center; padding: 48px 20px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-dim); letter-spacing: .06em;
    border: 2px dashed var(--line-strong);
  }
  .empty-big {
    font-family: var(--marker); font-size: 30px; letter-spacing: .01em;
    color: var(--ink); margin-bottom: 8px;
  }

  /* ---------- Sync status bar ---------- */
  .sync-status {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 24px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .08em;
    color: var(--ink-dim);
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.syncing { background: var(--blue); animation: pulse 1s infinite; }
  .sync-dot.err { background: var(--red); }
  .sync-status button {
    margin-left: auto;
    background: var(--paper); border: 2px solid var(--line-strong); color: var(--ink-dim);
    font-family: var(--mono); font-size: 9px; letter-spacing: .08em; font-weight: 700;
    padding: 4px 10px; min-height: 30px; cursor: pointer;
  }

<body>

<header class="header">

<script>
// Race-level settings — defaults below, overwritten once the Settings tab loads.
let START_HOUR = 4;
// Route: TSP v2.0 — Santa Monica → Las Vegas
// KML-derived: 290.9 mi · 23,657 ft gain · 21,499 ft loss
// Strict rotation: EK → DC → BA → DJ → LM → LC (every 6 legs, no reordering)
let TOTAL_MILES = 290.9;
// Elevation total is derived from ROUTE_PROFILE once it loads (falls back
// to this fixed figure until then, or if the route data is unavailable).

// Sheet colors are shown as-is unless they'd be hard to read on the current background.
function readableColor(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return isDark() ? '#a9abaf' : '#5f5f5f';
  let [r,g,b]=[0,2,4].map(i=>parseInt(m[1].substr(i,2),16));
  const lum=(R,G,B)=>{const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};return 0.2126*f(R)+0.7152*f(G)+0.0722*f(B);};
  let guard=0;
  if(isDark()){
    const bg=lum(17,19,23);
    while(((lum(r,g,b)+0.05)/(bg+0.05))<4 && guard++<40){ r=Math.round(r+(255-r)*0.12); g=Math.round(g+(255-g)*0.12); b=Math.round(b+(255-b)*0.12); }
  } else {
    while((1.05/(lum(r,g,b)+0.05))<3.2 && guard++<40){ r=Math.round(r*0.92); g=Math.round(g*0.92); b=Math.round(b*0.92); }
  }
  return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
}

function fatigueMult(hrs){
  if(hrs< 6) return 1.000;
  if(hrs<12) return 1.022;
  if(hrs<18) return 1.048;
  if(hrs<24) return 1.075;
  if(hrs<30) return 1.108;
  if(hrs<36) return 1.145;
  if(hrs<42) return 1.185;
  return 1.230;
}
function shortLegBonus(mi){
  if(mi<=2.0) return 0.94;
  if(mi<=2.5) return 0.95;
  if(mi<=3.0) return 0.97;
  if(mi<=3.5) return 0.985;
  return 1.0;
}
function todMult(tod){
  if(tod>=22||tod<4)  return 0.978;
  if(tod>=11&&tod<17) return 1.052;
  return 1.0;
}
function todLabel(tod){
  if(tod>=22||tod<4)  return 'Night';
  if(tod>=11&&tod<17) return 'Heat';
  if(tod>=4&&tod<7)   return 'Dawn';
  return 'Normal';
}
// Grade penalty: gain/mi → extra seconds/mile (Minetti-derived)
function gradePenalty(gainFt, miles){
  const gpm = gainFt / miles;
  return gpm * 0.018;
}
function fmtPace(spm){
  if(!spm||isNaN(spm)) return '--';
  const s=Math.round(spm); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}
function fmtDur(mins){
  if(!mins||isNaN(mins)||mins<=0) return '--';
  const m=Math.round(mins),h=Math.floor(m/60),mm=m%60;
  return h>0?h+'h '+(mm<10?'0':'')+mm+'m':mm+'m';
}
function fmtClock(startHour,elapsedMins){
  const tot=Math.round(startHour*60+elapsedMins),h=Math.floor(tot/60)%24,m=tot%60;
  return ((h%12)||12)+':'+(m<10?'0':'')+m+(h>=12?'pm':'am');
}
function dayLabel(e){return e<1440?'Day 1':e<2880?'Day 2':'Day 3';}

// ---- Pacing model ----
// Leg 1 for a runner: 80% of their road 10K pace (i.e. run at 80% of 10K speed — slower than race pace).
// Leg 2: average of their leg-1 pace and that same 80%-of-10K baseline.
// Leg 3+: fatigue-adjusted average of the legs they've actually run — 10K pace no longer factors in.
// Time-of-day, short-leg bonus, and elevation still apply on top at every stage.
function pace10kFor(name){
  const r=ALL_PEOPLE.find(x=>x.name===name);
  return r && r.base10k ? r.base10k : 480;
}
function estimateLegPace(runnerName, milesThisLeg, gainFtThisLeg, history, currentElapsedHrs, currentTod){
  // history: chronological array of {pace, hrs} for this runner's own prior legs (actual or, pre-race, simulated)
  const pace10k=pace10kFor(runnerName);
  const baseline80=pace10k/0.80;
  const k=history.length;
  let base;
  if(k===0){
    base=baseline80;
  } else if(k===1){
    base=(history[0].pace+baseline80)/2;
  } else {
    const avgPace=history.reduce((a,h)=>a+h.pace,0)/history.length;
    const avgHrs=history.reduce((a,h)=>a+h.hrs,0)/history.length;
    const ratio=fatigueMult(currentElapsedHrs)/fatigueMult(avgHrs);
    base=avgPace*ratio;
  }
  const elev=gradePenalty(gainFtThisLeg, milesThisLeg);
  return base*todMult(currentTod)*shortLegBonus(milesThisLeg)+elev;
}

// Pre-race projected plan: walks the fixed rotation in order, building each
// runner's own simulated pace history as it goes (no actual data exists yet).
// Elevation gain for every leg comes from ROUTE_PROFILE (the real, mile-by-mile
// course data in the RouteProfile Sheet tab) once it's loaded; falls back to
// the fixed LEG_SPECS figure until then, or if the route data is unavailable.
let ROUTE_PROFILE=[]; // [{start,end,gainFt}, ...] half-mile increments, from RouteProfile tab
function buildSchedule(){
  const legs=[]; let elapsed=0;
  const projHistory={};
  LEG_SPECS.forEach((spec, legIdx) => {
    const [startMile, mi, specGainFt, runnerName] = spec;
    const r = RUNNERS.find(x=>x.name===runnerName);
    const hrs = elapsed/60;
    const tod = ((START_HOUR*60+elapsed)/60)%24;
    const hist = projHistory[runnerName]||[];
    const gainFt = effectiveGain(startMile, mi, specGainFt, mi);
    const pace = estimateLegPace(runnerName, mi, gainFt, hist, hrs, tod);
    const dur = (pace*mi)/60;
    legs.push({
      legNum: legIdx+1, runner: r,
      startMile: Math.round(startMile*10)/10,
      miles: Math.round(mi*10)/10,
      gainFt: gainFt,
      pace, dur, elapsedStart: elapsed,
      tod, condition: todLabel(tod)
    });
    if(!projHistory[runnerName]) projHistory[runnerName]=[];
    projHistory[runnerName].push({pace, hrs});
    elapsed += dur;
  });
  return legs;
}

function rebuildSchedule(){
  SCHEDULE=buildSchedule();
  TOTAL_LEGS=SCHEDULE.length;
  totalProjMins=SCHEDULE.reduce((a,l)=>a+l.dur,0);
}

}

class AuthError extends Error {}
class ServerError extends Error {}

async function apiFetch(url, opts){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), API_TIMEOUT_MS);
  try{
    const res = await fetch(url, Object.assign({ signal: ctl.signal }, opts||{}));
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    if(j.error==='auth') throw new AuthError('auth');
    if(j.error) throw new ServerError(j.error);
    return j;
  } finally { clearTimeout(t); }
}
function apiGet(action){
  return apiFetch(API_URL+'?action='+encodeURIComponent(action)+'&key='+encodeURIComponent(API_KEY)+'&_='+Date.now());
}
function apiPost(body){
  return apiFetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ key: API_KEY }, body)) });
}
function isNetErr(e){ return !(e instanceof AuthError) && !(e instanceof ServerError); }

function setSyncStatus(state, text){
  const dot=document.getElementById('sync-dot');
  const label=document.getElementById('sync-text');
  if(!dot||!label) return;
  dot.className='sync-dot'+(state?' '+state:'');
  label.textContent=text;
}
function refreshSyncStatus(){
  const waiting = outbox.filter(o=>o.action==='add').length;
  const other = outbox.length - waiting;
  const last = lastSyncAt ? ' from '+clockStr(lastSyncAt) : '';
  if(netState==='offline'){
    if(outbox.length) setSyncStatus('warn', `No signal · ${waiting?waiting+' leg'+(waiting>1?'s':''):''}${other&&waiting?' + ':''}${other?other+' fix'+(other>1?'es':''):''} waiting`);
    else setSyncStatus('err', 'No signal · saved data'+last);
  } else if(outbox.length){
    setSyncStatus('syncing', `Sending ${outbox.length} waiting…`);
  } else {
    setSyncStatus('ok', lastSyncAt ? 'Synced '+clockStr(lastSyncAt) : 'Connecting…');
  }
}
function clockStr(d){ let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'pm':'am'; h=h%12||12; return h+':'+(m<10?'0':'')+m+ap; }

function applyOverrides(list){
  overrides={};
  (list||[]).forEach(o=>{ overrides[o.legNumber]={runner:o.runner||null, miles:(o.miles===null||o.miles===undefined||o.miles==='')?null:parseFloat(o.miles)}; });
}
function normLeg(l, i){
  return { id:String(l.id), legNumber: l.legNumber||i+1, runner:l.runner, miles:parseFloat(l.miles)||0,
           dur:parseFloat(l.dur)||0, gainFt:parseFloat(l.gainFt)||0, start:l.start||'', end:l.end||'', pending:!!l.pending };
}

// Take any API (or cached) payload and update app state.
function ingest(d, fromCache){
  if(!d) return;
  let sched=false;
  if(d.runners && d.runners.length){ applyRoster(d.runners); sched=true; }
  if(d.route && d.route.length){ ROUTE_PROFILE=d.route; sched=true; }
  if(d.settings){ applySettings(d.settings); sched=true; }
  if(d.config) applyRaceCfg(d.config);
  if(d.overrides) applyOverrides(d.overrides);
  if(d.legs) serverLegs=d.legs.map(normLeg);
  if(d.items){ logiItems=d.items; logiLoaded=true; }
  if(d.going){ crewGoing=d.going; goingLoaded=true; }
  if(d.checklist){ checklist=d.checklist; checklistLoaded=true; }
  if(!fromCache){
    ['runners','route','settings','config','overrides','legs','items','going','checklist'].forEach(k=>{ if(d[k]!==undefined) CACHE[k]=d[k]; });
    CACHE.savedAt=new Date().toISOString();
    lsSet(CACHE_STORE, JSON.stringify(CACHE));
    lastSyncAt=new Date();
  }
  rebuildActual();
  if(sched) rebuildSchedule();
}

// Legs the app shows = what the sheet has + anything still queued on this phone.
function rebuildActual(){
  const legs = serverLegs.map(l=>Object.assign({}, l));
  const maxN = legs.length ? legs[legs.length-1].legNumber : 0;
  outbox.forEach(op=>{
    if(op.action==='add' && op.params.legNumber>maxN && !legs.some(l=>l.legNumber===op.params.legNumber)){
      legs.push(normLeg({ id:'q-'+op.qid, legNumber:op.params.legNumber, runner:op.params.runner, miles:op.params.miles,
        dur:op.params.dur, gainFt:op.params.gainFt, start:op.params.start, end:op.params.end, pending:true }));
    }
    if(op.action==='updateLeg'){
      const l=legs.find(x=>x.id===String(op.params.id));
      if(l){ ['runner','miles','dur'].forEach(k=>{ if(op.params[k]!=null) l[k]=op.params[k]; }); l.pending=true; }
    }
    if(op.action==='startRace' && !RACE_CFG.actualStart){ RACE_CFG.actualStart=new Date(op.params.at); updateStartHour(); }
  });
  legs.sort((a,b)=>a.legNumber-b.legNumber);
  actualLegs=legs;
}

function saveOutbox(){ lsSet(OUTBOX_STORE, JSON.stringify(outbox)); }
function newQid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Race-critical changes (handoffs, leg fixes, race start) are queued so they survive dead zones.
function queueAndSend(action, params){
  const qid=newQid();
  if(action==='add') params.clientId=qid;
  outbox.push({ qid, action, params, at:new Date().toISOString() });
  saveOutbox();
  rebuildActual();
  renderPage(getActivePageId());
  refreshSyncStatus();
  flushOutbox();
}

async function flushOutbox(){
  if(flushing || !outbox.length || !API_KEY) return;
  flushing=true;
  try{
    while(outbox.length){
      const op=outbox[0];
      try{
        const d=await apiPost(Object.assign({ action: op.action }, op.params));
        outbox.shift(); saveOutbox();
        netState='ok';
        if(d.duplicate) toast(`Leg ${d.duplicateLeg} was already logged from another phone — kept that one.`);
        ingest(d);
      }catch(e){
        if(e instanceof AuthError){ showGate('Team code changed — enter it again.'); break; }
        if(e instanceof ServerError){
          outbox.shift(); saveOutbox();
          toast("Couldn't save: "+e.message);
          continue;
        }
        netState='offline'; break;   // no signal — try again later
      }
    }
  } finally {
    flushing=false;
    rebuildActual();
    refreshSyncStatus();
    renderPage(getActivePageId());
    autoLand();
  }
}

// Pull fresh data. 'all' on open/manual sync (includes roster + route), 'live' when polling.
async function syncNow(full){
  if(!API_KEY) return;
  await flushOutbox();
  try{
    const d=await apiGet(full||!staticLoaded ? 'all' : 'live');
    if(full||!staticLoaded) staticLoaded=true;
    netState='ok';
    ingest(d);
  }catch(e){
    if(e instanceof AuthError){ showGate('Enter the team code.'); return; }
    netState='offline';
  }
  refreshSyncStatus();
  rerenderSafely();
  autoLand();
}
function rerenderSafely(){
  const typing=document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  const id=getActivePageId();
  if(typing) return;                       // don't wipe a form someone is filling in
  if(id==='logistics' && logiFormOpen){ renderCrewLine(); renderChecklist(); return; }
  renderPage(id);
}
function manualSync(){ setSyncStatus('syncing','Syncing…'); syncNow(true); }
function startPolling(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer=setInterval(()=>{ if(document.visibilityState==='visible') syncNow(false); }, SYNC_INTERVAL_MS);
}

// Non-race edits (logistics, crew, checklist, plan adjustments) — try now; tell them if there's no signal.
async function postNow(body){
  try{
    const d=await apiPost(body);
    netState='ok'; ingest(d); refreshSyncStatus();
    return d;
  }catch(e){
    if(e instanceof AuthError){ showGate('Enter the team code.'); return null; }
    if(e instanceof ServerError){ toast("Couldn't save: "+e.message); return null; }
    netState='offline'; refreshSyncStatus();
    toast('No signal — that change wasn’t saved. Try again when you have bars.');
    return null;
  }
}

function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.className='show';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ el.className=''; }, 4200);
}

// ---------- Route profile helpers ----------
// Sum elevation gain across an arbitrary mile range using the half-mile route
// profile, prorating partial segments.
function gainForRange(startMile, milesLen){
  if(!ROUTE_PROFILE.length || !milesLen || milesLen<=0) return null;
  const endMile=startMile+milesLen;
  let gain=0;
  for(const seg of ROUTE_PROFILE){
    const overlapStart=Math.max(startMile, seg.start);
    const overlapEnd=Math.min(endMile, seg.end);
    if(overlapEnd>overlapStart){
      const segLen=seg.end-seg.start;
      const frac=segLen>0?(overlapEnd-overlapStart)/segLen:0;
      gain+=seg.gainFt*frac;
    }
  }
  return Math.round(gain);
}
function effectiveGain(startMile, milesLen, fallbackGainFt, fallbackMiles){
  const routeGain=gainForRange(startMile, milesLen);
  if(routeGain!==null) return routeGain;
  if(fallbackMiles>0) return Math.round(fallbackGainFt*(milesLen/fallbackMiles));
  return fallbackGainFt||0;
}

// Merge the default schedule with any live override for this leg, recomputing
// gain/pace/duration from where the leg actually starts on the course.
function getEffectiveLeg(legIndex, startMile){
  if(legIndex<0 || legIndex>=TOTAL_LEGS) return null;
  const base=SCHEDULE[legIndex];
  const legNumber=legIndex+1;
  const ov=overrides[legNumber];
  const runner=(ov&&ov.runner)?(ALL_PEOPLE.find(p=>p.name===ov.runner)||base.runner):base.runner;
  const miles=(ov&&ov.miles!=null&&!isNaN(ov.miles))?ov.miles:base.miles;
  const gainFt=effectiveGain(startMile, miles, base.gainFt, base.miles);
  const pace=projPaceForLeg(runner.name, miles, gainFt);
  const dur=pace?(pace*miles)/60:null;
  return {legNumber, runner, miles, gainFt, pace, dur, startMile, condition:base.condition, overridden:!!(ov&&(ov.runner||ov.miles!=null))};
}

// ---------- Roster (from the Runners tab) ----------
// Rotation codes (EK, DC, BA, DJ, LM, LC) are fixed; name/initials/color/pace come from the sheet.
function applyRoster(rows){
  if(!rows || !rows.length) return;
  const byCode={};
  rows.forEach(r=>{ byCode[r.code]=r; });
  RUNNERS = DEFAULT_RUNNERS.map(def=>{
    const s=byCode[def.name];
    if(!s) return {...def, baseColor:def.color};
    return {
      name:def.name,
      fullName:s.fullName||def.fullName,
      init:s.init||def.init,
      baseColor:s.color||def.color,
      base10k:(s.pace10kSecPerMi!=null)?s.pace10kSecPerMi:def.base10k
    };
  });
  const rotationCodes=DEFAULT_RUNNERS.map(r=>r.name);
  const extras=rows.filter(r=>r.isSupport || !rotationCodes.includes(r.code));
  SUPPORT = extras.length ? extras.map(s=>({ name:s.code, fullName:s.fullName||s.code, init:s.init||s.code, baseColor:s.color||'#888888' }))
                          : DEFAULT_SUPPORT.map(r=>({...r, baseColor:r.color}));
  recolorPeople();
}
// Re-derive display colors for the current theme (light/dark) from the sheet colors.
function recolorPeople(){
  RUNNERS.concat(SUPPORT).forEach(r=>{ r.color=readableColor(r.baseColor||r.color); });
  RUNNER_COLORS={};
  RUNNERS.concat(SUPPORT).forEach(r=>{ RUNNER_COLORS[r.name]=r.color; });

}

// Hours since midnight (Pacific) for a Date — the race clock runs on Pacific time.
function ptHours(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:RACE_TZ,hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(d);
  const g=t=>+(p.find(x=>x.type===t)||{value:0}).value;
  return g('hour')+g('minute')/60+g('second')/3600;
}
// Clock times everywhere are "start + elapsed", so anchor to the real gun time once it's known.

function getActualGain(){
  return actualLegs.reduce((a,l)=>a+(l.gainFt||0),0);
}
function getRunnerActualPace(name){
  const rl=actualLegs.filter(l=>l.runner===name);
  if(!rl.length) return null;
  const mi=rl.reduce((a,l)=>a+parseFloat(l.miles),0);
  const mn=rl.reduce((a,l)=>a+l.dur,0);
  return mi?mn/mi*60:null;
}
// Chronological {pace, hrs} history of a runner's own completed legs, built
// by walking the master race log (actualLegs) so we know how far into the
// race each of their legs actually started.
function getRunnerActualHistory(name){
  let elapsed=0; const hist=[];
  actualLegs.forEach(l=>{
    if(l.runner===name){
      const pace=l.dur/parseFloat(l.miles)*60;
      hist.push({pace, hrs: elapsed/60});
    }
    elapsed+=l.dur;
  });
  return hist;
}
function projPaceForLeg(runnerName,mi,gainFt){
  const hist=getRunnerActualHistory(runnerName);
  const currentElapsedHrs=getActualElapsed()/60;
  const currentTod=((START_HOUR*60+getActualElapsed())/60)%24;
  return estimateLegPace(runnerName, mi, gainFt||0, hist, currentElapsedHrs, currentTod);
}

function fmtDiff(sec){
  const t=Math.round(Math.abs(sec)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), ss=t%60;
  return (t===0?'':sec<0?'−':'+')+h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

// ============ RACE: start, handoff, live timer ============
function fmtHMS(mins){
  if(mins==null||isNaN(mins)) return '--';
  const t=Math.max(0,Math.round(mins*60)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
// "42:30", "1:02:05", "42" (minutes) → minutes
function parseDurInput(str){
  str=String(str||'').trim(); if(!str) return NaN;
  const p=str.split(':').map(x=>parseFloat(x));
  if(p.some(isNaN)) return NaN;
  if(p.length===3) return p[0]*60+p[1]+p[2]/60;
  if(p.length===2) return p[0]+p[1]/60;
  return p[0];
}

  if(last && last.end){ const d=new Date(last.end); if(!isNaN(d)) return d; }
  const st=RACE_CFG.actualStart||RACE_CFG.raceStart;
  return st ? new Date(st.getTime()+getActualElapsed()*60000) : null;

let lastHandoffAt=0;
function doHandoff(){
  if(Date.now()-lastHandoffAt<3000){ toast('Just logged a handoff — give it a second.'); return; }
  const done=actualLegs.length;
  const eff=getEffectiveLeg(done, getActualMiles());
  if(!eff) return;
  const start=currentLegStart();
  if(!start){ toast('Start the race clock first.'); return; }
  const end=new Date();
  const dur=(end-start)/60000;
  if(dur<1){ toast("That's under a minute — looks like a double tap, so it wasn't logged."); return; }
  const nxt=getEffectiveLeg(done+1, getActualMiles()+eff.miles);
  const msg=`${eff.runner.fullName} finished leg ${done+1} (${Math.round(eff.miles*10)/10} mi) in ${fmtHMS(dur)}?`+(nxt?`\n\nNext up: ${nxt.runner.fullName}.`:'\n\nThat’s the last leg — Las Vegas!')+(dur>240?'\n\n(That’s over 4 hours — double-check before logging.)':'');
  if(!confirm(msg)) return;
  lastHandoffAt=Date.now();
  queueAndSend('add', {
    legNumber: done+1, runner: eff.runner.name, miles: eff.miles,
    dur: Math.round(dur*1000)/1000, gainFt: eff.gainFt||0,
    start: start.toISOString(), end: end.toISOString()
  });
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
}

  if(!confirm('Start the race clock now?\n\nTap this the moment the first runner leaves the pier.')) return;
  const at=new Date();
  RACE_CFG.actualStart=at; updateStartHour();
  queueAndSend('startRace', { at: at.toISOString() });
}

function clockStrPT(d){ return d.toLocaleTimeString('en-US',{timeZone:RACE_TZ,hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase(); }
function raceElapsedNow(){
  const st=RACE_CFG.actualStart;
  if(st) return Math.max(0,(Date.now()-st.getTime())/60000);
  return getActualElapsed()+(currentLegMinutes()||0);
}
// Projected minutes for the legs still to run (uses live adjustments + actual paces so far).
function projectRemaining(done, actMiles){
  let mile=actMiles, total=0; const legs=[];
  for(let k=done;k<TOTAL_LEGS;k++){
    const eff=getEffectiveLeg(k, mile);
    if(!eff) break;
    legs.push(eff); total+=eff.dur||0; mile+=eff.miles;
  }
  return { total, legs };
}
// Seconds ahead (−) or behind (+) the original plan across completed legs.
function cumulativeVsPlan(){
  let c=0;
  actualLegs.forEach((l,i)=>{ const p=SCHEDULE[i]; if(p) c+= l.dur*60 - p.pace*parseFloat(l.miles); });
  return c;
}

  const el=document.getElementById('page-splits');

  const remain=projectRemaining(done, actMiles);
  const projFinish=actElapsed+remain.total;
  const cum=cumulativeVsPlan();
  const totMi=actMiles, avgPace=totMi?actElapsed/totMi*60:totalProjMins*60/TOTAL_MILES;

  const wide=window.innerWidth>600;            // condition column only on wider screens

  actualLegs.forEach((l,i)=>{

      <td class="col-time"><span class="t-main">${fmtHMS(eff.dur)}</span><span class="t-sub">${fmtPace(eff.pace)}/mi</span></td>
      <td class="col-diff">${j===0&&raceStarted()?'<span class="now-tag">running</span>':''}</td>
      <td class="col-diff"></td>
      ${wide?`<td class="col-cond"><span class="tag tag-${cond.toLowerCase()}">${cond}</span></td>`:''}
    </tr>`;
    elapsed+=eff.dur||0;
  });

  const runnerSplits=RUNNERS.map(r=>{

      <div class="runner-split-left"><div class="av" style="border-color:${r.color};color:${r.color}">${esc(r.init)}</div><span class="runner-split-name">${esc(r.fullName)}</span></div>
      <div class="runner-split-right"><strong>${rl.length?fmtPace(mn/mi*60)+'/mi':'—'}</strong>${Math.round(mi*10)/10} of ${Math.round(projMi*10)/10} mi &bull; ${rl.length} legs</div>
    </div>`;

  el.innerHTML=`
  <div class="stat-grid">
    <div class="stat-cell highlight"><div class="stat-cell-label">Proj Finish</div><div class="stat-cell-val" style="font-size:22px">${fmtClock(START_HOUR,projFinish)}</div><div class="stat-cell-sub">${fmtHMS(projFinish)} total</div></div>

    <div class="stat-cell"><div class="stat-cell-label">${done?'Avg Pace':'Plan Pace'}</div><div class="stat-cell-val" style="font-size:22px">${fmtPace(avgPace)}</div><div class="stat-cell-sub">per mile</div></div>
  </div>
  <div class="splits-key">
    <span class="tag tag-night">NIGHT</span><span class="tag tag-heat">HEAT</span><span class="tag tag-dawn">DAWN</span>
    <span class="splits-note">Green = ahead of plan, red = behind. Tap a finished leg to fix it.${Object.keys(overrides).length?' * = adjusted distance.':''}</span>

  <div class="tbl-wrap"><div class="tbl-scroll splits-scroll"><table class="splits-tbl">
    <thead><tr>

    </tr></thead>

  </table></div></div>
  <div class="section-head" style="margin-top:22px">Runner Splits</div>
  <div class="info-block">${runnerSplits}</div>`;
  // keep the current leg in view
  const cur=el.querySelector('tr.is-current');
  const sc=el.querySelector('.splits-scroll');
  if(cur&&sc&&done>3) sc.scrollTop=Math.max(0,cur.offsetTop-sc.clientHeight/3);

function openFix(id){ fixOpenId=id; goPage('log'); setTimeout(()=>{ const e=document.getElementById('fix-'+id); if(e) e.scrollIntoView({block:'center'}); },50); }

function submitLeg(){
  const runner=document.getElementById('log-runner').value;
  const miles=parseFloat(document.getElementById('log-miles').value);
  const dur=parseDurInput(document.getElementById('log-dur').value);
  const msg=document.getElementById('log-msg');
  if(!runner||isNaN(miles)||miles<=0||isNaN(dur)||dur<=0){ msg.textContent=' ← fill in runner, miles and time'; msg.style.color='var(--red)'; return; }
  const start=currentLegStart()||new Date(Date.now()-dur*60000);
  const end=new Date(start.getTime()+dur*60000);
  const done=actualLegs.length;
  const gainFt=effectiveGain(getActualMiles(), miles, 0, miles)||0;
  queueAndSend('add', { legNumber: done+1, runner, miles, dur: Math.round(dur*1000)/1000, gainFt, start: start.toISOString(), end: end.toISOString() });
  toast('Leg '+(done+1)+' added.');
}
function saveFix(id){
  const runner=document.getElementById('fx-runner').value;
  const miles=parseFloat(document.getElementById('fx-miles').value);
  const dur=parseDurInput(document.getElementById('fx-dur').value);
  if(isNaN(miles)||miles<=0||isNaN(dur)||dur<=0){ toast('Check the miles and time.'); return; }
  const leg=actualLegs.find(l=>l.id===id);
  if(!leg) return;
  if(leg.pending && id.startsWith('q-')){
    // still on this phone — just edit the queued handoff
    const op=outbox.find(o=>'q-'+o.qid===id);
    if(op){ Object.assign(op.params,{runner,miles,dur}); if(op.params.start) op.params.end=new Date(new Date(op.params.start).getTime()+dur*60000).toISOString(); saveOutbox(); }
    fixOpenId=null; rebuildActual(); renderLog(); toast('Fixed.'); return;
  }
  fixOpenId=null;
  queueAndSend('updateLeg', { id, runner, miles, dur: Math.round(dur*1000)/1000 });
  toast('Fix saved.');
}
async function removeLeg(id){
  if(!confirm('Remove this leg for everyone?')) return;
  if(id.startsWith('q-')){
    outbox=outbox.filter(o=>'q-'+o.qid!==id); saveOutbox(); rebuildActual(); renderLog(); return;
  }
  if(await postNow({action:'delete', id})) renderLog();
}
async function clearAll(){
  if(!confirm('Clear ALL logged legs and the start time for everyone? This can\'t be undone.')) return;
  if(!confirm('Really sure? This wipes the whole race log.')) return;
  outbox=outbox.filter(o=>o.action!=='add'&&o.action!=='startRace'&&o.action!=='updateLeg'); saveOutbox();
  RACE_CFG.actualStart=null;
  if(await postNow({action:'clear'})){ updateStartHour(); renderLog(); }
}
async function saveStartTime(){
  const v=document.getElementById('fix-start').value;
  if(!v){ toast('Pick a start time.'); return; }
  const d=new Date(v);
  if(isNaN(d)){ toast('That time didn’t parse.'); return; }
  if(!confirm('Set the race start to '+fmtPT(d,{weekday:'short',hour:'numeric',minute:'2-digit',second:'2-digit'})+' PT?')) return;
  if(await postNow({action:'startRace', at:d.toISOString(), force:true})){ updateStartHour(); renderLog(); toast('Start time saved.'); }
}

function logiConfigured(){ return true; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPT(d, opts){ return d.toLocaleString('en-US', Object.assign({timeZone:RACE_TZ}, opts)); }

function applyRaceCfg(cfg){
  if(!cfg) return;
  const rs=cfg.RaceStart?new Date(cfg.RaceStart):null;
  const to=cfg.TrackerOpens?new Date(cfg.TrackerOpens):null;
  RACE_CFG.raceStart = rs && !isNaN(rs) ? rs : null;
  RACE_CFG.trackerOpens = to && !isNaN(to) ? to : (RACE_CFG.raceStart ? new Date(RACE_CFG.raceStart.getTime()-8*3600e3) : null);
  const as=cfg.ActualStart?new Date(cfg.ActualStart):null;
  RACE_CFG.actualStart = as && !isNaN(as) ? as : null;
  updateStartHour();
}

// Logistics now loads and saves through the shared data layer (ingest / postNow).
async function postLogi(params){
  const d=await postNow(params);
  if(!d) throw new Error('not saved');
  return d;
}

// ---- Race mode: 'pre' (logistics landing) → 'race' (tracker landing) → 'post' (logistics again) ----
function raceFinished(){
  return actualLegs.length>0 && (actualLegs.length>=TOTAL_LEGS || getActualMiles()>=TOTAL_MILES-0.1);
}
function raceMode(){
  const now=Date.now();
  if(raceFinished()) return 'post';
  if(RACE_CFG.raceStart && now > RACE_CFG.raceStart.getTime()+RACE_MAX_HOURS*3600e3) return 'post';
  if(RACE_CFG.trackerOpens) return now>=RACE_CFG.trackerOpens.getTime() ? 'race' : 'pre';
  return actualLegs.length>0 ? 'race' : 'pre'; // no date loaded yet: fall back to "legs are being logged"
}
function landingPage(){ return raceMode()==='race' ? 'dash' : 'logistics'; }
// Only jumps pages when the mode changes (first load, 8PM night-before, finish) —
// never yanks someone off a page they chose otherwise, and never mid-typing.
function updateLiveBadge(mode){
  const box=document.getElementById('header-status'), lbl=document.getElementById('status-label');
  if(!box||!lbl) return;
  box.className='header-status '+mode;
  lbl.textContent = mode==='race' ? 'LIVE' : mode==='post' ? 'Finished!' : 'LALV27';
}
function autoLand(){
  const mode=raceMode();
  updateLiveBadge(mode);
  if(mode===lastLandMode) return;
  const typing=document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if(typing && lastLandMode!==null) return;
  if(lastLandMode!==null && getActivePageId()==='logistics' && logiFormOpen && landingPage()==='logistics'){ lastLandMode=mode; return; }
  lastLandMode=mode;
  goPage(landingPage());
}

// ---- Time helpers. Entries are stored as typed local times ("2027-04-01T09:15") ----
function parseLocal(s){
  if(!s) return null;
  const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  return {y:+m[1], mo:+m[2], d:+m[3], h:m[4]!=null?+m[4]:null, mi:m[5]!=null?+m[5]:0};
}
function localKey(p){ return p ? p.y*1e8+p.mo*1e6+p.d*1e4+(p.h==null?0:p.h)*100+p.mi : Infinity; }
// "Is it over yet?" — treat typed times as Pacific (where almost everything happens)
function localToMs(p, endOfDay){
  if(!p) return null;
  const h=p.h==null?(endOfDay?23:0):p.h, mi=p.h==null?(endOfDay?59:0):p.mi;
  return Date.UTC(p.y,p.mo-1,p.d,h+7,mi);
}
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function dayHeader(p){
  const dow=new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay();
  return DOW[dow]+' · '+MON[p.mo-1]+' '+p.d+(p.y!==2027?', '+p.y:'');
}
function shortDay(p){
  const dow=new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay();
  return DOW[dow].charAt(0)+DOW[dow].slice(1).toLowerCase()+' '+MON[p.mo-1].charAt(0)+MON[p.mo-1].slice(1).toLowerCase()+' '+p.d;
}
function clockOf(p){
  if(!p||p.h==null) return '';
  return ((p.h%12)||12)+':'+(p.mi<10?'0':'')+p.mi+(p.h>=12?'pm':'am');
}
function sameDay(a,b){ return a&&b&&a.y===b.y&&a.mo===b.mo&&a.d===b.d; }

function itemIsPast(it){
  const s=parseLocal(it.start), e=parseLocal(it.end);
  const ref=e||s; if(!ref) return false;
  return localToMs(ref, true) < Date.now();
}
// ---- Crew "going" line (Runners tab → Going column) ----
let crewGoing = {};   // code -> true/false
let goingLoaded = false;
let logiPending = 0;
const SHARPIE_CHECK='<svg viewBox="0 0 22 20" aria-hidden="true"><path d="M2.5 11.5 C4.5 12.8 6.2 14.6 7.6 17 C10.4 10.6 14.6 5.2 20 1.8"/></svg>';
function crewLineHTML(){
  if(!logiConfigured()) return '';
  const n=ALL_PEOPLE.filter(p=>crewGoing[p.name]).length, tot=ALL_PEOPLE.length;
  const all=goingLoaded && n===tot;
  return `<div class="crew-line">
    <div class="confirm-count${all?' all':''}">${!goingLoaded?'Crew':all?'Full crew confirmed!':n+' of '+tot+' confirmed going'}<span class="hint">TAP TO MARK</span></div>
    <div class="who-row" style="margin-top:6px">${ALL_PEOPLE.map(p=>{
      const ok=!!crewGoing[p.name];
      return `<button class="who-chip${ok?' ok':''}" style="border-color:${p.color}80;color:${p.color}" data-code="${esc(p.name)}" onclick="toggleGoing(this)" aria-pressed="${ok}" title="${ok?'Going — tap to undo':'Tap to confirm going'}"><span class="mark">${ok?SHARPIE_CHECK:''}</span>${esc(p.fullName)}</button>`;
    }).join('')}</div>
  </div>`;
}
function renderCrewLine(){
  const el=document.getElementById('crew-line-wrap');
  if(el) el.innerHTML=crewLineHTML();
}
async function toggleGoing(btn){
  const code=btn.getAttribute('data-code');
  const before=!!crewGoing[code];
  crewGoing[code]=!before;
  renderCrewLine(); // optimistic
  logiPending++;
  const d=await postNow({action:'setGoing', code, going:!before});
  logiPending--;
  if(!d){ crewGoing[code]=before; }
  renderCrewLine();
}
function whoList(it){ return String(it.who||'').split(',').map(x=>x.trim()).filter(Boolean); }
function personFor(code){
  if(code==='TEAM') return {name:'TEAM', fullName:'Whole team', color:readableColor('#125db9')};
  return ALL_PEOPLE.find(p=>p.name===code) || {name:code, fullName:code, color:readableColor('#888888')};
}

// ---- Countdown ----
function countdownHTML(){
  const mode=raceMode();
  if(!RACE_CFG.raceStart){
    return logiConfigured()
      ? ''
      : `<div class="hint-box"><strong>Logistics isn't connected yet.</strong> Deploy the Logistics Apps Script and paste its URL into <strong>LOGI_API_URL</strong>.</div>`;
  }
  const startTxt=fmtPT(RACE_CFG.raceStart,{weekday:'short',month:'short',day:'numeric'}).toUpperCase()+' · '+fmtPT(RACE_CFG.raceStart,{hour:'numeric',minute:'2-digit'}).toUpperCase()+' PT';
  if(mode==='race'){
    return `<div class="countdown live">
      <div class="countdown-label">● RACE WEEKEND IS LIVE</div>
      <div class="countdown-val">LA <span>→</span>LV</div>
      <div class="countdown-sub">START ${startTxt}</div>
      <button class="btn" style="margin-top:14px" onclick="goPage('dash')">OPEN TRACKER</button>
    </div>`;
  }
  if(mode==='post'){
    return `<div class="countdown">
      <div class="countdown-label">LALV27</div>
      <div class="countdown-val">FINISHED</div>
      <div class="countdown-sub">Everything still to come is below</div>
    </div>`;
  }
  return `<div class="countdown">
    <div class="countdown-label">RACE STARTS IN</div>
    <div class="countdown-val" id="countdown-val">${countdownText()}</div>
    <div class="countdown-sub">${startTxt}<br>TRACKER OPENS ${fmtPT(RACE_CFG.trackerOpens,{weekday:'short',hour:'numeric',minute:'2-digit'}).toUpperCase()}</div>
  </div>`;
}
function countdownText(){
  if(!RACE_CFG.raceStart) return '';
  let ms=Math.max(0, RACE_CFG.raceStart.getTime()-Date.now());
  const d=Math.floor(ms/86400e3); ms-=d*86400e3;
  const h=Math.floor(ms/3600e3); ms-=h*3600e3;
  const m=Math.floor(ms/60e3);
  return (d?d+'<span>D</span>':'')+h+'<span>H</span>'+m+'<span>M</span>';
}
function tickCountdown(){
  const el=document.getElementById('countdown-val');
  if(el) el.innerHTML=countdownText();
}

function setLogiType(k){
  logiFilterType=k;
  document.querySelectorAll('#page-logistics .logi-toolbar .chip').forEach(b=>{
    const key=b.textContent==='ALL'?'all':LOGI_TYPES.find(t=>t.key.toUpperCase()===b.textContent).key;
    b.classList.toggle('on', key===k);
  });
  renderLogiList();
}

function renderLogiList(){
  const listEl=document.getElementById('logi-list');
  if(!listEl) return;
  const hero=document.getElementById('logi-hero');
  if(hero) hero.innerHTML=countdownHTML();
  renderCrewLine();

  if(!logiLoaded){
    listEl.innerHTML = logiConfigured()
      ? `<div class="empty"><div class="empty-big">LOADING…</div></div>`
      : `<div class="empty"><div class="empty-big">NOT CONNECTED</div>Logistics backend URL not set yet.</div>`;
    return;
  }

  let items=logiItems.slice();
  if(logiFilterType!=='all') items=items.filter(it=>it.type===logiFilterType);
  if(logiFilterWho!=='all') items=items.filter(it=>{ const w=whoList(it); return w.includes(logiFilterWho)||w.includes('TEAM')||!w.length; });
  items.sort((a,b)=>localKey(parseLocal(a.start))-localKey(parseLocal(b.start)) || String(a.title).localeCompare(String(b.title)));

  const upcoming=items.filter(it=>!itemIsPast(it));
  const past=items.filter(it=>itemIsPast(it));

  if(!logiItems.length){
    listEl.innerHTML=`<div class="empty"><div class="empty-big">NOTHING BOOKED YET</div>Tap + ADD for flights, hotels, cars, the RV…</div>`;
    return;
  }

  let html='';
  if(!upcoming.length){
    html+=`<div class="empty" style="padding:28px 20px"><div class="empty-big" style="font-size:24px">ALL CAUGHT UP</div>Nothing upcoming${logiFilterType!=='all'||logiFilterWho!=='all'?' for this filter':''}.</div>`;
  } else {
    html+=groupedCards(upcoming, true);
  }
  if(past.length){
    html+=`<button class="btn-ghost past-toggle" onclick="logiShowPast=!logiShowPast;renderLogiList()">${logiShowPast?'HIDE':'SHOW'} PAST (${past.length})</button>`;
    if(logiShowPast) html+=groupedCards(past.slice().reverse(), false, true);
  }
  listEl.innerHTML=html;
}

function groupedCards(items, markNext, isPast){
  let html='', lastKey=null, nextMarked=!markNext;
  items.forEach(it=>{
    const s=parseLocal(it.start);
    const key=s?s.y+'-'+s.mo+'-'+s.d:'none';
    if(key!==lastKey){
      html+=`<div class="logi-day">${s?dayHeader(s):'NO DATE YET'}</div>`;
      lastKey=key;
    }
    const isNext=!nextMarked && !!s;
    if(isNext) nextMarked=true;
    html+=logiCard(it, isNext, isPast);
  });
  return html;
}

function logiCard(it, isNext, isPast){
  const t=logiType(it.type);
  const s=parseLocal(it.start), e=parseLocal(it.end);
  let timeHTML='';
  if(s){
    timeHTML=`<small>${t.startLbl.toUpperCase()}</small>${clockOf(s)||'—'}`;
  }
  let endLine='';
  if(e){
    endLine = sameDay(s,e)
      ? `<div><b>${t.endLbl.toUpperCase()}</b>${clockOf(e)}</div>`
      : `<div><b>${t.endLbl.toUpperCase()}</b>${shortDay(e)}${clockOf(e)?' · '+clockOf(e):''}</div>`;
  }
  const who=whoList(it);
  const isFlight=it.type==='Flight';
  const mapsLink=(!isFlight && it.location) ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.location) : '';
  const link=/^https?:\/\//i.test(it.link||'') ? it.link : '';
  return `<div class="logi-card${isNext?' is-next':''}${isPast?' is-past':''}" style="border-left-color:${readableColor(t.color)}">
    <div class="logi-top">
      <div style="min-width:0">
        <div class="logi-type" style="color:${readableColor(t.color)}">${esc(t.key.toUpperCase())}${isNext?'<span class="next-up">next up</span>':''}${ME&&who.includes(ME)?'<span class="you-tag">you</span>':''}</div>
        <div class="logi-title">${esc(it.title||'(untitled)')}</div>
      </div>
      <div class="logi-time">${timeHTML}</div>
    </div>
    <div class="logi-meta">
      ${it.location?`<div><b>${isFlight?'ROUTE':'WHERE'}</b>${esc(it.location)}</div>`:''}
      ${endLine}
      ${it.confirmation?`<div><b>CONF #</b><button class="conf-btn" data-v="${esc(it.confirmation)}" onclick="copyConf(this)">${esc(it.confirmation)}</button></div>`:''}
    </div>
    ${it.notes?`<div class="logi-notes">${esc(it.notes)}</div>`:''}
    ${who.length?`<div class="who-row">${who.map(c=>{const p=personFor(c);return `<span class="who-chip" style="border-color:${p.color}80;color:${p.color}">${esc(p.fullName)}</span>`;}).join('')}</div>`:''}
    <div class="logi-actions">
      ${link?`<a class="btn-ghost accent" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">OPEN LINK ↗</a>`:''}
      ${mapsLink?`<a class="btn-ghost accent" href="${mapsLink}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">MAP ↗</a>`:''}
      <button class="btn-ghost" style="border-color:var(--line-strong)" onclick="openLogiForm('${esc(it.id)}')">EDIT</button>
      <button class="btn-ghost" style="border-color:var(--line-strong)" onclick="openLogiForm(null,'${esc(it.id)}')">DUPLICATE</button>
      <button class="btn-ghost" onclick="deleteLogi('${esc(it.id)}')">DELETE</button>
    </div>
  </div>`;
}

function copyConf(btn){
  const val=btn.getAttribute('data-v');
  const done=()=>{ const o=btn.textContent; btn.textContent='COPIED ✓'; setTimeout(()=>{btn.textContent=o;},1200); };
  if(navigator.clipboard) navigator.clipboard.writeText(val).then(done).catch(()=>{});
}

// ---- Add / edit form ----
let logiCopyFrom=null;
function openLogiForm(id, copyFrom){
  if(!logiConfigured()) return;
  logiEditingId=id||null;
  logiCopyFrom=copyFrom||null;
  logiFormOpen=true;
  renderLogiForm();
  const wrap=document.getElementById('logi-form-wrap');
  if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeLogiForm(){
  logiFormOpen=false; logiEditingId=null; logiCopyFrom=null;
  const wrap=document.getElementById('logi-form-wrap');
  if(wrap) wrap.innerHTML='';
}
function renderLogiForm(){
  const wrap=document.getElementById('logi-form-wrap');
  if(!wrap) return;
  let it=logiEditingId ? (logiItems.find(x=>x.id===logiEditingId)||{}) : {};
  // Duplicate: same details, but pick the person again and clear the confirmation #
  if(!logiEditingId && logiCopyFrom){ const src=logiItems.find(x=>x.id===logiCopyFrom); if(src) it=Object.assign({}, src, {id:'', who:'', confirmation:''}); }
  const type=it.type||'Flight';
  const t=logiType(type);
  const who=whoList(it);
  const v=k=>esc(it[k]||'');
  const dt=k=>{ const p=parseLocal(it[k]); return p?`${p.y}-${String(p.mo).padStart(2,'0')}-${String(p.d).padStart(2,'0')}T${String(p.h==null?0:p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`:''; };
  wrap.innerHTML=`<div class="form-card logi-form">
    <div class="form-label" style="font-size:11px;margin-bottom:14px">${logiEditingId?'EDIT ITEM':logiCopyFrom?'COPY OF “'+esc(it.title||'')+'” — PICK WHO IT’S FOR':'NEW ITEM'}</div>
    <div class="form-row two">
      <div><div class="form-label">Type</div>
        <select id="lf-type" onchange="logiTypeChanged()">${LOGI_TYPES.map(x=>`<option${x.key===type?' selected':''}>${x.key}</option>`).join('')}</select>
      </div>
      <div><div class="form-label">Title</div>
        <input type="text" id="lf-title" value="${v('title')}" placeholder="${esc(t.titlePh)}">
      </div>
    </div>
    <div class="form-row two">
      <div><div class="form-label" id="lf-start-lbl">${t.startLbl} (local time)</div>
        <input type="datetime-local" id="lf-start" value="${dt('start')}">
      </div>
      <div><div class="form-label" id="lf-end-lbl">${t.endLbl} (local time)</div>
        <input type="datetime-local" id="lf-end" value="${dt('end')}">
      </div>
    </div>
    <div class="form-row two">
      <div><div class="form-label" id="lf-loc-lbl">${type==='Flight'?'Route':'Location'}</div>
        <input type="text" id="lf-location" value="${v('location')}" placeholder="${esc(t.locPh)}">
      </div>
      <div><div class="form-label">Confirmation #</div>
        <input type="text" id="lf-conf" value="${v('confirmation')}" autocapitalize="characters" autocomplete="off">
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Who</div>
        <div class="who-pick" id="lf-who">
          <label class="${who.includes('TEAM')?'on':''}"><input type="checkbox" value="TEAM"${who.includes('TEAM')?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">Whole team</label>
          ${ALL_PEOPLE.map(p=>`<label class="${who.includes(p.name)?'on':''}"><input type="checkbox" value="${esc(p.name)}"${who.includes(p.name)?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(p.fullName)}</label>`).join('')}
        </div>
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Link (booking, itinerary…)</div>
        <input type="url" id="lf-link" value="${v('link')}" placeholder="https://">
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Notes</div>
        <textarea id="lf-notes" placeholder="Seats, terminal, who's driving, parking…">${v('notes')}</textarea>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btn" id="lf-save" onclick="saveLogi()">${logiEditingId?'SAVE CHANGES':'ADD'}</button>
      <button class="btn-ghost" onclick="closeLogiForm()">CANCEL</button>
      <span id="logi-msg"></span>

}
function logiTypeChanged(){
  const t=logiType(document.getElementById('lf-type').value);
  document.getElementById('lf-start-lbl').textContent=t.startLbl+' (local time)';
  document.getElementById('lf-end-lbl').textContent=t.endLbl+' (local time)';
  document.getElementById('lf-loc-lbl').textContent=t.key==='Flight'?'Route':'Location';
  document.getElementById('lf-title').placeholder=t.titlePh;
  document.getElementById('lf-location').placeholder=t.locPh;
}
async function saveLogi(){
  const g=id=>document.getElementById(id);
  const msg=g('logi-msg'), btn=g('lf-save');
  const item={
    id: logiEditingId||'',
    type: g('lf-type').value,
    title: g('lf-title').value.trim(),
    start: g('lf-start').value,
    end: g('lf-end').value,
    location: g('lf-location').value.trim(),
    confirmation: g('lf-conf').value.trim(),
    who: Array.from(document.querySelectorAll('#lf-who input:checked')).map(x=>x.value).join(','),
    link: g('lf-link').value.trim(),
    notes: g('lf-notes').value.trim(),
  };
  if(!item.title){ msg.textContent=' ← add a title'; msg.style.color='var(--red)'; return; }
  if(item.start && item.end && item.end<item.start){ msg.textContent=' ← end is before start'; msg.style.color='var(--red)'; return; }
  btn.disabled=true; msg.textContent=' saving…'; msg.style.color='var(--ink-dim)';
  try{
    await postLogi({action:'save', item});
    closeLogiForm();
    renderLogiList();
  }catch(err){
    msg.textContent=' ✗ not saved — try again'; msg.style.color='var(--red)';
    btn.disabled=false;
  }
}
async function deleteLogi(id){
  const it=logiItems.find(x=>x.id===id);
  if(!it) return;
  if(!confirm('Delete "'+(it.title||'this item')+'" for everyone?')) return;
  try{
    await postLogi({action:'deleteItem', id});
    if(logiEditingId===id) closeLogiForm();
    renderLogiList();
  }catch(err){ /* postNow already told them */ }
}
// ---- Shared checklist (Checklist tab) ----
let checkShowDone=false;
function checklistHTML(){
  if(!checklistLoaded) return '';
  const open=checklist.filter(c=>!c.done), done=checklist.filter(c=>c.done);
  const mineFirst=(a,b)=>((b.who===ME)-(a.who===ME));
  const row=c=>{
    const p=c.who?personFor(c.who):null;
    return `<div class="check-row${c.done?' done':''}${ME&&c.who===ME?' mine':''}">
      <button class="check-box" onclick="toggleCheck('${esc(c.id)}',${!c.done})" aria-label="${c.done?'Mark not done':'Mark done'}">${c.done?SHARPIE_CHECK:''}</button>
      <span class="check-text">${esc(c.text)}</span>
      ${p?`<span class="who-chip" style="border-color:${p.color}80;color:${p.color}">${esc(p.fullName)}</span>`:''}
      <button class="check-del" onclick="deleteCheck('${esc(c.id)}')" aria-label="Delete">×</button>
    </div>`;
  };
  return `<div class="checklist">
    <div class="checklist-head">
      <div class="section-head" style="margin-bottom:0">Checklist</div>
      <span class="confirm-count">${checklist.length?done.length+' of '+checklist.length+' done':'Packing, gear, to-dos'}</span>
    </div>
    <div class="check-list">${open.slice().sort(mineFirst).map(row).join('')||'<div class="check-empty">Nothing open — add gear, packing or to-dos below.</div>'}</div>
    ${done.length?`<button class="btn-ghost past-toggle" style="margin-top:6px" onclick="checkShowDone=!checkShowDone;renderChecklist()">${checkShowDone?'HIDE':'SHOW'} DONE (${done.length})</button>${checkShowDone?`<div class="check-list">${done.map(row).join('')}</div>`:''}`:''}
    <div class="check-add">
      <input type="text" id="check-text" placeholder="Add an item (e.g. cooler + ice)" maxlength="300" onkeydown="if(event.key==='Enter')addCheck()">
      <select id="check-who" aria-label="Who's on it"><option value="">Anyone</option>${ALL_PEOPLE.map(p=>`<option value="${esc(p.name)}">${esc(p.fullName)}</option>`).join('')}</select>
      <button class="btn" onclick="addCheck()">ADD</button>
    </div>
  </div>`;
}
function renderChecklist(){ const el=document.getElementById('checklist-wrap'); if(el) el.innerHTML=checklistHTML(); }
async function addCheck(){
  const t=document.getElementById('check-text'), w=document.getElementById('check-who');
  const text=(t.value||'').trim(); if(!text) return;
  const who=w.value;
  t.value='';
  if(await postNow({action:'checkAdd', text, who})) renderChecklist(); else t.value=text;
}
async function toggleCheck(id, done){
  const c=checklist.find(x=>x.id===id); if(!c) return;
  const before=c.done; c.done=done; renderChecklist();
  logiPending++;
  const d=await postNow({action:'checkToggle', id, done});
  logiPending--;
  if(!d) c.done=before;
  renderChecklist();
}
async function deleteCheck(id){
  const c=checklist.find(x=>x.id===id); if(!c) return;
  if(!confirm('Delete "'+c.text+'"?')) return;
  if(await postNow({action:'checkDelete', id})) renderChecklist();
}
// ============ END LOGISTICS ============

// ============ BOOT ============
// 1) Show whatever this phone saved last time (works with no signal),
// 2) ask for the team code if we don't have it, 3) sync, then keep syncing.
applyTheme(true);
recolorPeople();
ingest(CACHE, true);
logiFilterWho = ME || 'all';
updateMeButton();
autoLand();
refreshSyncStatus();
if(!API_KEY) showGate();
else { syncNow(true).then(()=>{ if(!ME) openMePicker(); }); }
startPolling();
setInterval(()=>{ tickCountdown(); autoLand(); applyTheme(); }, 30000);
setInterval(tickLegTimer, 1000);
window.addEventListener('online', ()=>{ netState='ok'; syncNow(false); });
window.addEventListener('offline', ()=>{ netState='offline'; refreshSyncStatus(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ syncNow(false); autoLand(); } });
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
