<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speed Project">
<meta name="theme-color" content="#0a0a0a">
<meta name="format-detection" content="telephone=no">
<title>The Speed Project — Race HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --black2: #111111;
    --black3: #1a1a1a;
    --tape: #f5e642;
    --tape-dark: #d4c832;
    --tape-dim: rgba(245,230,66,0.12);
    --tape-border: rgba(245,230,66,0.35);
    --white: #f0ede4;
    --white-dim: rgba(240,237,228,0.55);
    --white-faint: rgba(240,237,228,0.12);
    --red: #e84040;
    --green: #4caf78;
    --gray: #444;
    --gray2: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  /* Tape texture overlay on nav */
  .tape-strip {
    position: relative;
    background: var(--tape);
    overflow: hidden;
  }
  .tape-strip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 6px,
      rgba(0,0,0,0.06) 6px,
      rgba(0,0,0,0.06) 12px
    );
    pointer-events: none;
  }
  .tape-strip::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.3);
  }

  /* Header */
  .header {
    padding: 0;
    padding-top: env(safe-area-inset-top);
    border-bottom: 3px solid var(--tape);
    position: relative;
  }
  .header-inner {
    display: flex;
    align-items: stretch;
    gap: 0;
  }
  .header-logo {
    padding: 16px 24px;
    border-right: 2px solid var(--tape);
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: .06em;
    color: var(--white);
    line-height: 1;
  }
  .header-sub {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--tape);
    letter-spacing: .15em;
    margin-top: 3px;
  }
  .header-meta {
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .header-meta-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .12em;
    color: var(--white-dim);
  }
  .header-meta-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: .04em;
    color: var(--tape);
    line-height: 1;
  }
  .header-status {
    margin-left: auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100%{opacity:1} 50%{opacity:.4}
  }
  .status-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--green);
  }

  /* Nav — fixed bottom tab bar on mobile */
  nav {
    display: flex;
    gap: 0;
    background: var(--black2);
    border-top: 2px solid var(--black3);
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    padding: 12px 6px 10px;
    background: transparent;
    border: none;
    color: var(--white-dim);
    cursor: pointer;
    position: relative;
    transition: color .2s;
    white-space: nowrap;
    min-height: 48px;
  }
  nav button::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--tape);
    transform: scaleX(0);
    transition: transform .2s;
  }
  nav button.active {
    color: var(--tape);
  }
  nav button.active::after {
    transform: scaleX(1);
  }
  nav button:hover:not(.active) {
    color: var(--white);
  }
  @media (min-width: 601px) {
    nav {
      position: sticky;
      top: 0;
      bottom: auto;
      border-top: none;
      border-bottom: 2px solid var(--black3);
    }
    nav button { flex: none; padding: 14px 24px; font-size: 11px; border-right: 1px solid rgba(255,255,255,0.05); }
    nav button::after { top: auto; bottom: 0; }
    body { padding-bottom: 0; }
  }

  /* Pages */
  .page { display: none; padding: 24px; }
  .page.active { display: block; }

  /* Stat grid */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 2px;
    margin-bottom: 20px;
    border: 2px solid var(--tape);
  }
  .stat-cell {
    background: var(--black2);
    padding: 14px 16px;
    border-right: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .stat-cell:last-child { border-right: none; }
  .stat-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .14em;
    color: var(--white-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .stat-cell-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: .03em;
    line-height: 1;
    color: var(--white);
  }
  .stat-cell-sub {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--white-dim);
    margin-top: 3px;
  }
  .stat-cell.highlight .stat-cell-val { color: var(--tape); }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 20px;
    position: relative;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--white-dim);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 8px;
    background: var(--black3);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--tape);
    position: relative;
    transition: width .6s ease;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent, transparent 4px,
      rgba(0,0,0,0.15) 4px, rgba(0,0,0,0.15) 8px
    );
  }

  /* Now running card */
  .now-card {
    border: 3px solid var(--tape);
    background: var(--black2);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .now-card::before {
    content: 'NOW RUNNING';
    position: absolute;
    top: 10px; right: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--tape);
    opacity: .5;
  }
  .now-runner-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: .04em;
    line-height: 1;
    color: var(--tape);
    margin-bottom: 4px;
  }
  .now-leg-info {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--white-dim);
    margin-bottom: 14px;
  }
  .now-stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
  }
  .now-stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .12em;
    color: var(--white-dim);
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .now-stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: .03em;
    color: var(--white);
    line-height: 1;
  }

  /* On deck card */
  .deck-card {
    border: 1px solid rgba(245,230,66,0.3);
    background: var(--black2);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .deck-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .14em;
    color: var(--tape);
    opacity: .6;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .deck-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: .04em;
    color: var(--white);
    line-height: 1;
  }
  .deck-info {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--white-dim);
    text-align: right;
  }
  .deck-info strong {
    display: block;
    font-size: 15px;
    color: var(--white);
    font-weight: 700;
    margin-bottom: 2px;
  }

  /* Runner grid */
  .runner-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 2px;
    margin-bottom: 0;
  }
  .runner-cell {
    background: var(--black2);
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }
  .runner-cell.is-next {
    border: 2px solid var(--tape);
  }
  .runner-cell-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .av {
    width: 30px;
    height: 30px;
    border: 2px solid var(--tape);
    background: var(--black3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--tape);
    flex-shrink: 0;
  }
  .runner-name-cell {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: .04em;
    color: var(--white);
    line-height: 1;
  }
  .runner-stats-cell {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--white-dim);
    line-height: 1.6;
  }
  .runner-miles-cell {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--tape);
    font-weight: 700;
    margin-top: 3px;
  }

  /* Section header — tape style */
  .section-head {
    display: inline-block;
    background: var(--tape);
    color: var(--black);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: .18em;
    padding: 3px 12px 3px 8px;
    margin-bottom: 12px;
    position: relative;
  }
  .section-head::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg, transparent, transparent 4px,
      rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 8px
    );
  }

  /* Table */
  .tbl-wrap {
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .tbl-scroll {
    max-height: 440px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tbl-scroll::-webkit-scrollbar { width: 4px; }
  .tbl-scroll::-webkit-scrollbar-track { background: var(--black2); }
  .tbl-scroll::-webkit-scrollbar-thumb { background: var(--tape); }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
  }
  thead th {
    background: var(--black3);
    padding: 8px 10px;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .14em;
    color: var(--tape);
    text-transform: uppercase;
    border-bottom: 2px solid var(--tape);
    font-weight: 400;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: 'DM Sans', sans-serif;
    color: var(--white-dim);
    vertical-align: middle;
  }
  tbody tr:hover td { background: rgba(245,230,66,0.04); color: var(--white); }
  tbody tr.is-current td { background: rgba(245,230,66,0.07); color: var(--white); }
  tbody tr.is-done { opacity: .3; }
  .pace-val {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--white);
    font-size: 11px;
  }

  /* Tags */
  .tag {
    display: inline-block;
    padding: 1px 6px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: .06em;
    border: 1px solid;
  }
  .tag-night { border-color: rgba(180,170,255,0.5); color: #b4aaff; background: rgba(180,170,255,0.08); }
  .tag-heat  { border-color: rgba(232,100,64,0.5);  color: #e86440; background: rgba(232,100,64,0.08); }
  .tag-dawn  { border-color: rgba(76,175,120,0.5);  color: #4caf78; background: rgba(76,175,120,0.08); }
  .tag-normal{ border-color: rgba(255,255,255,0.15); color: var(--white-dim); }

  .diff-pos { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--red); font-weight: 700; }
  .diff-neg { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--green); font-weight: 700; }
  .diff-ok  { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--white-dim); }

  /* Form */
  .form-card {
    background: var(--black2);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 20px;
    margin-bottom: 16px;
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .form-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: .12em;
    color: var(--tape);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    background: var(--black);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--white);
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    padding: 11px 12px;
    outline: none;
    transition: border-color .2s;
    min-height: 44px;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus { border-color: var(--tape); }
  select option { background: var(--black2); }

  .btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: .12em;
    padding: 12px 28px;
    min-height: 44px;
    background: var(--tape);
    color: var(--black);
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: opacity .15s;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg, transparent, transparent 4px,
      rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 8px
    );
  }
  .btn:hover { opacity: .88; }
  .btn-ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white-dim);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    padding: 8px 12px;
    min-height: 36px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--red); color: var(--red); }
  .btn-ghost::before { display: none; }

  #log-msg {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    margin-left: 12px;
  }

  .hint-box {
    background: rgba(245,230,66,0.06);
    border-left: 3px solid var(--tape);
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--white-dim);
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .hint-box strong { color: var(--tape); }

  /* Actual summary two-col */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-bottom: 16px; }
  .info-block {
    background: var(--black2);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 16px;
  }
  .info-block-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    letter-spacing: .14em;
    color: var(--tape);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .info-block-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--white);
    line-height: 1;
    letter-spacing: .03em;
  }
  .info-block-sub {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--white-dim);
    margin-top: 4px;
  }
  .runner-split-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .runner-split-row:last-child { border-bottom: none; }
  .runner-split-left { display: flex; align-items: center; gap: 8px; }
  .runner-split-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: .04em; color: var(--white); }
  .runner-split-right { text-align: right; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--white-dim); }
  .runner-split-right strong { color: var(--tape); display: block; font-size: 13px; margin-bottom: 1px; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--white-dim);
    letter-spacing: .08em;
    border: 1px dashed rgba(255,255,255,0.1);
  }
  .empty-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: .08em;
    color: rgba(255,255,255,0.12);
    margin-bottom: 8px;
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    .stat-grid { grid-template-columns: repeat(2,1fr); }
    .runner-grid { grid-template-columns: repeat(2,1fr); }
    .form-row { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .now-runner-name { font-size: 38px; }
    .stat-cell-val { font-size: 22px; }
    .page { padding: 16px; }
    .header-meta { display: none; }
    .header-logo { padding: 12px 16px; }
    .header-title { font-size: 22px; }
    .sync-status { padding: 10px 16px !important; }
  }

  /* Sync status bar */
  .sync-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 24px;
    background: var(--black2);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    color: var(--white-dim);
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gray);
    flex-shrink: 0;
  }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.syncing { background: var(--tape); animation: pulse 1s infinite; }
  .sync-dot.err { background: var(--red); }
  .sync-status button {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--white-dim);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    padding: 5px 10px;
    min-height: 30px;
    cursor: pointer;
  }
  .sync-status button:active { border-color: var(--tape); color: var(--tape); }

  /* ============ LOGISTICS ============ */
  @media (max-width: 600px) {
    nav button { font-size: 9px; letter-spacing: .05em; padding: 12px 2px 10px; }
  }
  .countdown {
    border: 3px solid var(--tape);
    background: var(--black2);
    padding: 18px 20px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .countdown-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px; letter-spacing: .16em;
    color: var(--tape); opacity: .8;
    margin-bottom: 6px;
  }
  .countdown-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 54px; letter-spacing: .04em; line-height: 1;
    color: var(--white);
  }
  .countdown-val span { font-size: 22px; color: var(--tape); margin: 0 10px 0 2px; }
  .countdown-sub {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: .1em;

// Strict rotation: EK → DC → BA → DJ → LM → JH (every 6 legs, no reordering)

// Elevation total is derived from ROUTE_PROFILE once it loads (falls back

const TOTAL_GAIN_FT_FALLBACK = 23657;

  if(ROUTE_PROFILE.length) return Math.round(ROUTE_PROFILE.reduce((a,s)=>a+s.gainFt,0));
  return TOTAL_GAIN_FT_FALLBACK;
}

// Hardcoded fallback roster — used until the Sheet's Runners tab loads (or if
// it's unreachable). Once loaded, the Sheet's data overwrites these in place.
// NOTE: the 6 codes below (EK, DC, BA, DJ, LM, JH) are wired into the fixed
// leg rotation in LEG_SPECS further down. Who/what is attached to a code
// (fullName, init, color, pace) is fully editable from the Sheet — the codes

const DEFAULT_RUNNERS = [

  {name:'DC', fullName:'Dayne',  init:'DC', base10k:480, color:'#7eb8f7'},

const DEFAULT_SUPPORT = [
  {name:'Support 1', fullName:'Support 1', init:'S1', color:'#888888'},
  {name:'Support 2', fullName:'Support 2', init:'S2', color:'#888888'},
];

let RUNNERS = DEFAULT_RUNNERS.map(r=>({...r}));
let SUPPORT = DEFAULT_SUPPORT.map(r=>({...r}));
let RUNNER_COLORS = {};
RUNNERS.concat(SUPPORT).forEach(r=>{ RUNNER_COLORS[r.name]=r.color; });
let ALL_PEOPLE = [...RUNNERS, ...SUPPORT];

// KML-derived leg specs: [startMile, legMiles, gainFt, runnerName]
// Pure EK→DC→BA→DJ→LM→JH rotation. No back-to-backs. DC/LM always 3 legs apart.
const LEG_SPECS = [

function fatigueMult(hrs){
  if(hrs< 6) return 1.000;
  if(hrs<12) return 1.022;
  if(hrs<18) return 1.048;
  if(hrs<24) return 1.075;
  if(hrs<30) return 1.108;
  if(hrs<36) return 1.145;
  if(hrs<42) return 1.185;
  return 1.230;
}
function shortLegBonus(mi){
  if(mi<=2.0) return 0.94;
  if(mi<=2.5) return 0.95;
  if(mi<=3.0) return 0.97;
  if(mi<=3.5) return 0.985;
  return 1.0;
}
function todMult(tod){
  if(tod>=22||tod<4)  return 0.978;
  if(tod>=11&&tod<17) return 1.052;
  return 1.0;
}
function todLabel(tod){
  if(tod>=22||tod<4)  return 'Night';
  if(tod>=11&&tod<17) return 'Heat';
  if(tod>=4&&tod<7)   return 'Dawn';
  return 'Normal';
}
// Grade penalty: gain/mi → extra seconds/mile (Minetti-derived)
function gradePenalty(gainFt, miles){
  const gpm = gainFt / miles;
  return gpm * 0.018;
}
function fmtPace(spm){
  if(!spm||isNaN(spm)) return '--';
  const s=Math.round(spm); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}
function fmtDur(mins){
  if(!mins||isNaN(mins)||mins<=0) return '--';
  const m=Math.round(mins),h=Math.floor(m/60),mm=m%60;
  return h>0?h+'h '+(mm<10?'0':'')+mm+'m':mm+'m';
}
function fmtClock(startHour,elapsedMins){
  const tot=startHour*60+elapsedMins,h=Math.floor(tot/60)%24,m=Math.round(tot%60);
  return ((h%12)||12)+':'+(m<10?'0':'')+m+(h>=12?'pm':'am');
}
function dayLabel(e){return e<1440?'Day 1':e<2880?'Day 2':'Day 3';}

// ---- Pacing model ----
// Leg 1 for a runner: 80% of their road 10K pace (i.e. run at 80% of 10K speed — slower than race pace).
// Leg 2: average of their leg-1 pace and that same 80%-of-10K baseline.
// Leg 3+: fatigue-adjusted average of the legs they've actually run — 10K pace no longer factors in.
// Time-of-day, short-leg bonus, and elevation still apply on top at every stage.
function pace10kFor(name){
  const r=ALL_PEOPLE.find(x=>x.name===name);
  return r && r.base10k ? r.base10k : 480;
}
function estimateLegPace(runnerName, milesThisLeg, gainFtThisLeg, history, currentElapsedHrs, currentTod){
  // history: chronological array of {pace, hrs} for this runner's own prior legs (actual or, pre-race, simulated)
  const pace10k=pace10kFor(runnerName);
  const baseline80=pace10k/0.80;
  const k=history.length;
  let base;
  if(k===0){
    base=baseline80;
  } else if(k===1){
    base=(history[0].pace+baseline80)/2;
  } else {
    const avgPace=history.reduce((a,h)=>a+h.pace,0)/history.length;
    const avgHrs=history.reduce((a,h)=>a+h.hrs,0)/history.length;
    const ratio=fatigueMult(currentElapsedHrs)/fatigueMult(avgHrs);
    base=avgPace*ratio;
  }
  const elev=gradePenalty(gainFtThisLeg, milesThisLeg);
  return base*todMult(currentTod)*shortLegBonus(milesThisLeg)+elev;
}

// Pre-race projected plan: walks the fixed rotation in order, building each
// runner's own simulated pace history as it goes (no actual data exists yet).
// Elevation gain for every leg comes from ROUTE_PROFILE (the real, mile-by-mile
// course data in the RouteProfile Sheet tab) once it's loaded; falls back to
// the fixed LEG_SPECS figure until then, or if the route data is unavailable.
let ROUTE_PROFILE=[]; // [{start,end,gainFt}, ...] half-mile increments, from RouteProfile tab
function buildSchedule(){
  const legs=[]; let elapsed=0;
  const projHistory={};
  LEG_SPECS.forEach((spec, legIdx) => {
    const [startMile, mi, specGainFt, runnerName] = spec;
    const r = RUNNERS.find(x=>x.name===runnerName);
    const hrs = elapsed/60;
    const tod = ((START_HOUR*60+elapsed)/60)%24;
    const hist = projHistory[runnerName]||[];
    const gainFt = effectiveGain(startMile, mi, specGainFt, mi);
    const pace = estimateLegPace(runnerName, mi, gainFt, hist, hrs, tod);
    const dur = (pace*mi)/60;
    legs.push({
      legNum: legIdx+1, runner: r,
      startMile: Math.round(startMile*10)/10,
      miles: Math.round(mi*10)/10,
      gainFt: gainFt,
      pace, dur, elapsedStart: elapsed,
      tod, condition: todLabel(tod)
    });
    if(!projHistory[runnerName]) projHistory[runnerName]=[];
    projHistory[runnerName].push({pace, hrs});
    elapsed += dur;
  });
  return legs;
}

let SCHEDULE=buildSchedule();
let TOTAL_LEGS=SCHEDULE.length;
let totalProjMins=SCHEDULE.reduce((a,l)=>a+l.dur,0);
function rebuildSchedule(){
  SCHEDULE=buildSchedule();
  TOTAL_LEGS=SCHEDULE.length;
  totalProjMins=SCHEDULE.reduce((a,l)=>a+l.dur,0);
}

// Per-runner total projected miles and gain
function runnerTotalProjMiles(name){
  return SCHEDULE.filter(l=>l.runner.name===name).reduce((a,l)=>a+l.miles,0);
}
function runnerTotalProjGain(name){
  return SCHEDULE.filter(l=>l.runner.name===name).reduce((a,l)=>a+l.gainFt,0);
}

// ============ GOOGLE SHEETS SYNC ============
// Paste the Web App URL from your Apps Script deployment here:
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbyY316px9irA8zVCAHm9NZQX4pJB18M6VmeF68Xm6HadrYze6saQfv17_H5cmmLbxRjIQ/exec';

let actualLegs=[]; // each: {id, runner, miles, dur, gainFt}
let overrides={}; // legNumber -> {runner, miles}
let syncTimer=null;
const SYNC_INTERVAL_MS = 15000;
const ROUTE_CACHE_KEY = 'tsp_route_profile_v1';
const ROSTER_CACHE_KEY = 'tsp_roster_v1';
const SETTINGS_CACHE_KEY = 'tsp_settings_v1';

function setSyncStatus(state, text){
  const dot=document.getElementById('sync-dot');
  const label=document.getElementById('sync-text');
  if(!dot||!label) return;
  dot.className='sync-dot'+(state?' '+state:'');
  label.textContent=text;
}

function sheetConfigured(){
  return SHEET_API_URL && SHEET_API_URL.indexOf('PASTE_YOUR') === -1;
}

function applyOverrides(list){
  overrides={};
  (list||[]).forEach(o=>{ overrides[o.legNumber]={runner:o.runner||null, miles:(o.miles===null||o.miles===undefined||o.miles==='')?null:parseFloat(o.miles)}; });
}

// ---- Route profile: fetched once, cached locally, refreshed quietly ----
async function loadRouteProfile(){
  try{
    const cached=localStorage.getItem(ROUTE_CACHE_KEY);
    if(cached){ ROUTE_PROFILE=JSON.parse(cached); }
  }catch(e){/* ignore cache errors */}
  if(!sheetConfigured()) return;
  try{
    const res=await fetch(SHEET_API_URL+'?action=route',{method:'GET'});
    if(!res.ok) return;
    const data=await res.json();
    if(data.route && data.route.length){
      ROUTE_PROFILE=data.route;
      try{ localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(ROUTE_PROFILE)); }catch(e){/* ignore */}
    }
  }catch(err){
    console.error('loadRouteProfile error', err);
  }
}

// Sum elevation gain across an arbitrary mile range using the half-mile route
// profile, prorating partial segments. Falls back to scaling the schedule's
// fixed gain figure if no route profile has been loaded yet.
function gainForRange(startMile, milesLen){
  if(!ROUTE_PROFILE.length || !milesLen || milesLen<=0) return null;
  const endMile=startMile+milesLen;
  let gain=0;
  for(const seg of ROUTE_PROFILE){
    const overlapStart=Math.max(startMile, seg.start);
    const overlapEnd=Math.min(endMile, seg.end);
    if(overlapEnd>overlapStart){
      const segLen=seg.end-seg.start;
      const frac=segLen>0?(overlapEnd-overlapStart)/segLen:0;
      gain+=seg.gainFt*frac;
    }
  }
  return Math.round(gain);
}
function effectiveGain(startMile, milesLen, fallbackGainFt, fallbackMiles){
  const routeGain=gainForRange(startMile, milesLen);
  if(routeGain!==null) return routeGain;
  if(fallbackMiles>0) return Math.round(fallbackGainFt*(milesLen/fallbackMiles));
  return fallbackGainFt||0;
}

// Merge the default schedule with any live override for this leg, and
// recompute gain/pace/duration against the real route profile + actual
// mile marker rather than the fixed plan. startMile = where this leg
// actually begins on the course (chained from actual progress so far).
function getEffectiveLeg(legIndex, startMile){
  if(legIndex<0 || legIndex>=TOTAL_LEGS) return null;
  const base=SCHEDULE[legIndex];
  const legNumber=legIndex+1;
  const ov=overrides[legNumber];
  const runner=(ov&&ov.runner)?(ALL_PEOPLE.find(p=>p.name===ov.runner)||base.runner):base.runner;
  const miles=(ov&&ov.miles!=null&&!isNaN(ov.miles))?ov.miles:base.miles;
  const gainFt=effectiveGain(startMile, miles, base.gainFt, base.miles);
  const pace=projPaceForLeg(runner.name, miles, gainFt);
  const dur=pace?(pace*miles)/60:null;
  return {legNumber, runner, miles, gainFt, pace, dur, startMile, condition:base.condition, overridden:!!(ov&&(ov.runner||ov.miles!=null))};
}

// ---- Full roster (name, initials, color, pace, support flag): fetched once,
// cached locally, refreshed quietly. Rebuilds RUNNERS/SUPPORT/RUNNER_COLORS/
// ALL_PEOPLE from whatever comes back, falling back to the hardcoded
// defaults for anything the Sheet doesn't have.
function applyRoster(rows){
  if(!rows || !rows.length) return;
  const byCode={};
  rows.forEach(r=>{ byCode[r.code]=r; });

  RUNNERS = DEFAULT_RUNNERS.map(def=>{
    const s=byCode[def.name];
    if(!s) return {...def};
    return {
      name:def.name, // rotation code never changes
      fullName:s.fullName||def.fullName,
      init:s.init||def.init,
      color:s.color||def.color,
      base10k:(s.pace10kSecPerMi!=null)?s.pace10kSecPerMi:def.base10k
    };
  });

  // Anything in the sheet flagged isSupport, or that doesn't match a rotation
  // code at all, becomes a selectable person (Log Leg dropdown etc.) without
  // being part of the fixed rotation/schedule.
  const rotationCodes=DEFAULT_RUNNERS.map(r=>r.name);
  const extras=rows.filter(r=>r.isSupport || !rotationCodes.includes(r.code));
  SUPPORT = extras.length ? extras.map(s=>({
    name:s.code, fullName:s.fullName||s.code, init:s.init||s.code, color:s.color||'#888888'
  })) : DEFAULT_SUPPORT.map(r=>({...r}));

  RUNNER_COLORS={};
  RUNNERS.concat(SUPPORT).forEach(r=>{ RUNNER_COLORS[r.name]=r.color; });
  ALL_PEOPLE=[...RUNNERS, ...SUPPORT];
}

async function fetchLegs(silent){
  if(!sheetConfigured()){
    setSyncStatus('err','Not connected — add your Sheet URL in the code');
    return;
  }
  if(!silent) setSyncStatus('syncing','Syncing…');
  try{
    const res=await fetch(SHEET_API_URL+'?action=list',{method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    actualLegs = (data.legs||[]).map(l=>({id:l.id, runner:l.runner, miles:parseFloat(l.miles), dur:parseFloat(l.dur), gainFt:parseFloat(l.gainFt)||0}));
    applyOverrides(data.overrides);
    setSyncStatus('ok','Synced '+nowClock());
    // Don't yank the form out from under someone mid-entry on the Log page
    const activePage=document.querySelector('.page.active');
    const onLogPage = activePage && activePage.id==='page-log' && document.activeElement && ['INPUT','SELECT'].includes(document.activeElement.tagName);
    autoLand();
    if(activePage && activePage.id==='page-logistics'){
      // logistics view doesn't depend on leg data — leave it (and any open form) alone
    } else if(!onLogPage){
      renderPage(getActivePageId());
    } else {
      renderLog(); // safe: rebuilds form with same defaults, doesn't touch focus badly enough to block typing between polls
    }
  }catch(err){
    setSyncStatus('err','Sync failed — check connection');
    console.error('fetchLegs error', err);
  }
}

function nowClock(){
  const d=new Date();
  let h=d.getHours(), m=d.getMinutes();
  const ap = h>=12?'pm':'am';
  h = h%12 || 12;
  return h+':'+(m<10?'0':'')+m+ap;
}

function getActivePageId(){
  const el=document.querySelector('.page.active');
  return el ? el.id.replace('page-','') : 'dash';
}

async function postToSheet(params){
  setSyncStatus('syncing','Saving…');
  const res=await fetch(SHEET_API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify(params)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

}

function getActualElapsed(){return actualLegs.reduce((a,l)=>a+l.dur,0);}
function getActualMiles(){return actualLegs.reduce((a,l)=>a+parseFloat(l.miles),0);}
function getActualGain(){
  return actualLegs.reduce((a,l)=>a+(l.gainFt||0),0);
}
function getRunnerActualPace(name){
  const rl=actualLegs.filter(l=>l.runner===name);
  if(!rl.length) return null;
  const mi=rl.reduce((a,l)=>a+parseFloat(l.miles),0);
  const mn=rl.reduce((a,l)=>a+l.dur,0);
  return mi?mn/mi*60:null;
}
// Chronological {pace, hrs} history of a runner's own completed legs, built
// by walking the master race log (actualLegs) so we know how far into the
// race each of their legs actually started.
function getRunnerActualHistory(name){
  let elapsed=0; const hist=[];
  actualLegs.forEach(l=>{
    if(l.runner===name){
      const pace=l.dur/parseFloat(l.miles)*60;
      hist.push({pace, hrs: elapsed/60});
    }
    elapsed+=l.dur;
  });
  return hist;
}
function projPaceForLeg(runnerName,mi,gainFt){
  const hist=getRunnerActualHistory(runnerName);
  const currentElapsedHrs=getActualElapsed()/60;
  const currentTod=((START_HOUR*60+getActualElapsed())/60)%24;
  return estimateLegPace(runnerName, mi, gainFt||0, hist, currentElapsedHrs, currentTod);
}

  html+=`<div class="form-card">
    <div class="form-row">

      <div class="section-head">Recent Legs</div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn-ghost" onclick="clearLast()">CLEAR LAST</button>

  } else {

function parseDur(str){
  str=str.trim();
  if(str.includes(':')){ const p=str.split(':'); return parseFloat(p[0])+parseFloat(p[1]||0)/60; }
  return parseFloat(str);
}
async function submitLeg(){
  const runner=document.getElementById('log-runner').value;
  const miles=parseFloat(document.getElementById('log-miles').value);
  const dur=parseDur(document.getElementById('log-dur').value);
  const msg=document.getElementById('log-msg');
  const btn=document.querySelector('#page-log .btn');
  if(!runner||isNaN(miles)||miles<=0||isNaN(dur)||dur<=0){
    msg.textContent=' ← fill in all fields'; msg.style.color='var(--red)'; return;
  }
  if(!sheetConfigured()){
    msg.textContent=' ← connect your Google Sheet first'; msg.style.color='var(--red)'; return;
  }
  if(btn) btn.disabled=true;
  msg.textContent=' saving…'; msg.style.color='var(--white-dim)';
  const gainFt=effectiveGain(getActualMiles(), miles, 0, miles) || 0;
  try{
    const result=await postToSheet({action:'add', runner, miles, dur, gainFt});
    actualLegs = (result.legs||[]).map(l=>({id:l.id, runner:l.runner, miles:parseFloat(l.miles), dur:parseFloat(l.dur), gainFt:parseFloat(l.gainFt)||0}));
    applyOverrides(result.overrides);
    setSyncStatus('ok','Synced '+nowClock());
    msg.textContent=' ✓ logged'; msg.style.color='var(--green)';
    document.getElementById('log-dur').value='';
    setTimeout(()=>renderLog(),500);
  }catch(err){
    console.error('submitLeg error', err);
    msg.textContent=' ✗ save failed — try again'; msg.style.color='var(--red)';
    setSyncStatus('err','Save failed');
  }finally{
    if(btn) btn.disabled=false;
  }
}
async function deleteLeg(idx){
  const leg=actualLegs[idx];
  if(!leg) return;
  if(!confirm('Remove this leg for everyone?')) return;
  try{
    const result=await postToSheet({action:'delete', id: leg.id});
    actualLegs = (result.legs||[]).map(l=>({id:l.id, runner:l.runner, miles:parseFloat(l.miles), dur:parseFloat(l.dur), gainFt:parseFloat(l.gainFt)||0}));
    applyOverrides(result.overrides);
    setSyncStatus('ok','Synced '+nowClock());
    renderLog();
  }catch(err){
    console.error('deleteLeg error', err);
    setSyncStatus('err','Delete failed — try again');
  }
}

function renderActual(){

  let elapsed=0;

      <div class="runner-split-left"><div class="av">${r.init}</div><span class="runner-split-name">${r.fullName}</span></div>
      <div class="runner-split-right"><strong>${fmtPace(mn/mi*60)}/mi</strong>${Math.round(mi*10)/10} mi &bull; ${rl.length} legs</div>

  el.innerHTML=`
  <div class="stat-grid">

    <div class="stat-cell"><div class="stat-cell-label">Total Time</div><div class="stat-cell-val" style="font-size:22px">${fmtDur(totMin)}</div></div>
    <div class="stat-cell"><div class="stat-cell-label">Actual Avg Pace</div><div class="stat-cell-val" style="font-size:22px">${fmtPace(avgPace)}</div></div>
  </div>
  <div class="two-col">
    <div class="info-block">
      <div class="info-block-label">Runner Splits</div>
      ${runnerSplits||'<div style="font-family:Space Mono,monospace;font-size:10px;color:rgba(240,237,228,.35)">No data</div>'}
    </div>
    <div class="info-block">

}

// ============ LOGISTICS + RACE-MODE LANDING ============
// Separate Apps Script web app for the Logistics tab + race timing (Settings tab).
const LOGI_API_URL = 'https://script.google.com/macros/s/AKfycbxw7cVAPDR6WZts0LFDZecY7Fu8tUAwtH-lujRoomRIawhBcSxtoRLygRJMNHf4G6ZtUg/exec';
const LOGI_CACHE_KEY = 'tsp_logistics_v1';
const RACECFG_CACHE_KEY = 'tsp_racecfg_v1';
const RACE_TZ = 'America/Los_Angeles';
const RACE_MAX_HOURS = 72; // safety: after start + this, treat the race as over even if the log isn't finished

let RACE_CFG = { raceStart:null, trackerOpens:null };
let logiItems = [];
let logiLoaded = false;
let logiFilterType = 'all';
let logiFilterWho = 'all';
let logiShowPast = false;
let logiFormOpen = false;
let logiEditingId = null;
let lastLandMode = null;

const LOGI_TYPES = [
  {key:'Flight',     color:'#7eb8f7', startLbl:'Departs',  endLbl:'Arrives',   titlePh:'e.g. Southwest 1234',          locPh:'e.g. IND → LAX'},
  {key:'Hotel',      color:'#c97ff5', startLbl:'Check-in', endLbl:'Check-out', titlePh:'e.g. Hampton Inn Santa Monica',  locPh:'Address'},
  {key:'Rental Car', color:'#f7a05a', startLbl:'Pickup',   endLbl:'Return',    titlePh:'e.g. Enterprise — minivan',      locPh:'Pickup location'},
  {key:'RV / Van',   color:'#a8e06a', startLbl:'Pickup',   endLbl:'Return',    titlePh:'e.g. Cruise America 30ft',       locPh:'Pickup location'},
  {key:'Meal',       color:'#f76f6f', startLbl:'Time',     endLbl:'Ends',      titlePh:'e.g. Team dinner',               locPh:'Restaurant / address'},
  {key:'Other',      color:'#f5e642', startLbl:'Starts',   endLbl:'Ends',      titlePh:'e.g. Packet pickup',             locPh:'Location'},
];
function logiType(k){ return LOGI_TYPES.find(t=>t.key===k) || LOGI_TYPES[LOGI_TYPES.length-1]; }

function logiConfigured(){ return LOGI_API_URL && LOGI_API_URL.indexOf('PASTE_')===-1; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPT(d, opts){ return d.toLocaleString('en-US', Object.assign({timeZone:RACE_TZ}, opts)); }

function applyRaceCfg(cfg){
  if(!cfg) return;
  const rs=cfg.RaceStart?new Date(cfg.RaceStart):null;
  const to=cfg.TrackerOpens?new Date(cfg.TrackerOpens):null;
  RACE_CFG.raceStart = rs && !isNaN(rs) ? rs : null;
  RACE_CFG.trackerOpens = to && !isNaN(to) ? to : (RACE_CFG.raceStart ? new Date(RACE_CFG.raceStart.getTime()-8*3600e3) : null);
  updateHeaderMeta();
}

function loadLogiCache(){
  try{ const c=localStorage.getItem(RACECFG_CACHE_KEY); if(c) applyRaceCfg(JSON.parse(c)); }catch(e){}
  try{ const c=localStorage.getItem(LOGI_CACHE_KEY); if(c){ logiItems=JSON.parse(c)||[]; logiLoaded=true; } }catch(e){}
}

function ingestLogi(data){
  if(data.config){
    applyRaceCfg(data.config);
    try{ localStorage.setItem(RACECFG_CACHE_KEY, JSON.stringify(data.config)); }catch(e){}
  }
  if(data.items){
    logiItems=data.items;
    logiLoaded=true;
    try{ localStorage.setItem(LOGI_CACHE_KEY, JSON.stringify(logiItems)); }catch(e){}
  }
}

async function fetchLogistics(silent){
  if(!logiConfigured()) return;
  try{
    const res=await fetch(LOGI_API_URL+'?action=list',{method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    ingestLogi(await res.json());
    if(getActivePageId()==='logistics') renderLogiList();
  }catch(err){
    console.error('fetchLogistics error', err);
    if(!silent) setSyncStatus('err','Logistics sync failed — showing saved copy');
  }
}

async function postLogi(params){
  const res=await fetch(LOGI_API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(params)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data.error) throw new Error(data.error);
  ingestLogi(data);
  return data;
}

// ---- Race mode: 'pre' (logistics landing) → 'race' (tracker landing) → 'post' (logistics again) ----
function raceFinished(){
  return actualLegs.length>0 && (actualLegs.length>=TOTAL_LEGS || getActualMiles()>=TOTAL_MILES-0.1);
}
function raceMode(){
  const now=Date.now();
  if(raceFinished()) return 'post';
  if(RACE_CFG.raceStart && now > RACE_CFG.raceStart.getTime()+RACE_MAX_HOURS*3600e3) return 'post';
  if(RACE_CFG.trackerOpens) return now>=RACE_CFG.trackerOpens.getTime() ? 'race' : 'pre';
  return actualLegs.length>0 ? 'race' : 'pre'; // no date loaded yet: fall back to "legs are being logged"
}
function landingPage(){ return raceMode()==='race' ? 'dash' : 'logistics'; }
// Only jumps pages when the mode changes (first load, 8PM night-before, finish) —
// never yanks someone off a page they chose otherwise, and never mid-typing.
function autoLand(){
  const mode=raceMode();
  if(mode===lastLandMode) return;
  const typing=document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if(typing && lastLandMode!==null) return;
  if(lastLandMode!==null && getActivePageId()==='logistics' && logiFormOpen && landingPage()==='logistics'){ lastLandMode=mode; return; }
  lastLandMode=mode;
  goPage(landingPage());
}

// ---- Time helpers. Entries are stored as typed local times ("2027-04-01T09:15") ----
function parseLocal(s){
  if(!s) return null;
  const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!m) return null;
  return {y:+m[1], mo:+m[2], d:+m[3], h:m[4]!=null?+m[4]:null, mi:m[5]!=null?+m[5]:0};
}
function localKey(p){ return p ? p.y*1e8+p.mo*1e6+p.d*1e4+(p.h==null?0:p.h)*100+p.mi : Infinity; }
// "Is it over yet?" — treat typed times as Pacific (where almost everything happens)
function localToMs(p, endOfDay){
  if(!p) return null;
  const h=p.h==null?(endOfDay?23:0):p.h, mi=p.h==null?(endOfDay?59:0):p.mi;
  return Date.UTC(p.y,p.mo-1,p.d,h+7,mi);
}
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function dayHeader(p){
  const dow=new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay();
  return DOW[dow]+' · '+MON[p.mo-1]+' '+p.d+(p.y!==2027?', '+p.y:'');
}
function shortDay(p){
  const dow=new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay();
  return DOW[dow].charAt(0)+DOW[dow].slice(1).toLowerCase()+' '+MON[p.mo-1].charAt(0)+MON[p.mo-1].slice(1).toLowerCase()+' '+p.d;
}
function clockOf(p){
  if(!p||p.h==null) return '';
  return ((p.h%12)||12)+':'+(p.mi<10?'0':'')+p.mi+(p.h>=12?'pm':'am');
}
function sameDay(a,b){ return a&&b&&a.y===b.y&&a.mo===b.mo&&a.d===b.d; }

function itemIsPast(it){
  const s=parseLocal(it.start), e=parseLocal(it.end);
  const ref=e||s; if(!ref) return false;
  return localToMs(ref, true) < Date.now();
}
function whoList(it){ return String(it.who||'').split(',').map(x=>x.trim()).filter(Boolean); }
function personFor(code){
  if(code==='TEAM') return {name:'TEAM', fullName:'Whole team', color:'#f5e642'};
  return ALL_PEOPLE.find(p=>p.name===code) || {name:code, fullName:code, color:'#888888'};
}

// ---- Countdown ----
function countdownHTML(){
  const mode=raceMode();
  if(!RACE_CFG.raceStart){
    return logiConfigured()
      ? ''
      : `<div class="hint-box"><strong>Logistics isn't connected yet.</strong> Deploy the Logistics Apps Script and paste its URL into <strong>LOGI_API_URL</strong>.</div>`;
  }
  const startTxt=fmtPT(RACE_CFG.raceStart,{weekday:'short',month:'short',day:'numeric'}).toUpperCase()+' · '+fmtPT(RACE_CFG.raceStart,{hour:'numeric',minute:'2-digit'}).toUpperCase()+' PT';
  if(mode==='race'){
    return `<div class="countdown" style="border-color:var(--green)">
      <div class="countdown-label" style="color:var(--green)">● RACE WEEKEND IS LIVE</div>
      <div class="countdown-val">LA <span>→</span>LV</div>
      <div class="countdown-sub">START ${startTxt}</div>
      <button class="btn" style="margin-top:14px" onclick="goPage('dash')">OPEN TRACKER</button>
    </div>`;
  }
  if(mode==='post'){
    return `<div class="countdown">
      <div class="countdown-label">LALV27</div>
      <div class="countdown-val">FINISHED</div>
      <div class="countdown-sub">Everything still to come is below</div>
    </div>`;
  }
  return `<div class="countdown">
    <div class="countdown-label">RACE STARTS IN</div>
    <div class="countdown-val" id="countdown-val">${countdownText()}</div>
    <div class="countdown-sub">${startTxt} · TRACKER OPENS ${fmtPT(RACE_CFG.trackerOpens,{weekday:'short',hour:'numeric',minute:'2-digit'}).toUpperCase()}</div>
  </div>`;
}
function countdownText(){
  if(!RACE_CFG.raceStart) return '';
  let ms=Math.max(0, RACE_CFG.raceStart.getTime()-Date.now());
  const d=Math.floor(ms/86400e3); ms-=d*86400e3;
  const h=Math.floor(ms/3600e3); ms-=h*3600e3;
  const m=Math.floor(ms/60e3);
  return (d?d+'<span>D</span>':'')+h+'<span>H</span>'+m+'<span>M</span>';
}
function tickCountdown(){
  const el=document.getElementById('countdown-val');
  if(el) el.innerHTML=countdownText();
}

function setLogiType(k){

    const key=b.textContent==='ALL'?'all':LOGI_TYPES.find(t=>t.key.toUpperCase()===b.textContent).key;

function renderLogiList(){
  const listEl=document.getElementById('logi-list');
  if(!listEl) return;
  const hero=document.getElementById('logi-hero');
  if(hero) hero.innerHTML=countdownHTML();

  if(!logiLoaded){
    listEl.innerHTML = logiConfigured()
      ? `<div class="empty"><div class="empty-big">LOADING…</div></div>`
      : `<div class="empty"><div class="empty-big">NOT CONNECTED</div>Logistics backend URL not set yet.</div>`;
    return;
  }

  let items=logiItems.slice();
  if(logiFilterType!=='all') items=items.filter(it=>it.type===logiFilterType);
  if(logiFilterWho!=='all') items=items.filter(it=>{ const w=whoList(it); return w.includes(logiFilterWho)||w.includes('TEAM')||!w.length; });
  items.sort((a,b)=>localKey(parseLocal(a.start))-localKey(parseLocal(b.start)) || String(a.title).localeCompare(String(b.title)));

  const upcoming=items.filter(it=>!itemIsPast(it));
  const past=items.filter(it=>itemIsPast(it));

  if(!logiItems.length){
    listEl.innerHTML=`<div class="empty"><div class="empty-big">NOTHING BOOKED YET</div>Tap + ADD for flights, hotels, cars, the RV…</div>`;
    return;
  }

  let html='';
  if(!upcoming.length){
    html+=`<div class="empty" style="padding:28px 20px"><div class="empty-big" style="font-size:24px">ALL CAUGHT UP</div>Nothing upcoming${logiFilterType!=='all'||logiFilterWho!=='all'?' for this filter':''}.</div>`;
  } else {
    html+=groupedCards(upcoming, true);
  }
  if(past.length){
    html+=`<button class="btn-ghost past-toggle" onclick="logiShowPast=!logiShowPast;renderLogiList()">${logiShowPast?'HIDE':'SHOW'} PAST (${past.length})</button>`;
    if(logiShowPast) html+=groupedCards(past.slice().reverse(), false, true);
  }
  listEl.innerHTML=html;
}

function groupedCards(items, markNext, isPast){
  let html='', lastKey=null, nextMarked=!markNext;
  items.forEach(it=>{
    const s=parseLocal(it.start);
    const key=s?s.y+'-'+s.mo+'-'+s.d:'none';
    if(key!==lastKey){
      html+=`<div class="logi-day">${s?dayHeader(s):'NO DATE YET'}</div>`;
      lastKey=key;
    }
    const isNext=!nextMarked && !!s;
    if(isNext) nextMarked=true;
    html+=logiCard(it, isNext, isPast);
  });
  return html;
}

function logiCard(it, isNext, isPast){
  const t=logiType(it.type);
  const s=parseLocal(it.start), e=parseLocal(it.end);
  let timeHTML='';
  if(s){
    timeHTML=`<small>${t.startLbl.toUpperCase()}</small>${clockOf(s)||'—'}`;
  }
  let endLine='';
  if(e){
    endLine = sameDay(s,e)
      ? `<div><b>${t.endLbl.toUpperCase()}</b>${clockOf(e)}</div>`
      : `<div><b>${t.endLbl.toUpperCase()}</b>${shortDay(e)}${clockOf(e)?' · '+clockOf(e):''}</div>`;
  }
  const who=whoList(it);
  const isFlight=it.type==='Flight';
  const mapsLink=(!isFlight && it.location) ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.location) : '';
  const link=/^https?:\/\//i.test(it.link||'') ? it.link : '';
  return `<div class="logi-card${isNext?' is-next':''}${isPast?' is-past':''}" style="border-left-color:${t.color}">
    <div class="logi-top">
      <div style="min-width:0">
        <div class="logi-type" style="color:${t.color}">${esc(t.key.toUpperCase())}${isNext?' · <span style="color:var(--tape)">NEXT UP</span>':''}</div>
        <div class="logi-title">${esc(it.title||'(untitled)')}</div>
      </div>
      <div class="logi-time">${timeHTML}</div>
    </div>
    <div class="logi-meta">
      ${it.location?`<div><b>${isFlight?'ROUTE':'WHERE'}</b>${esc(it.location)}</div>`:''}
      ${endLine}
      ${it.confirmation?`<div><b>CONF #</b><button class="conf-btn" data-v="${esc(it.confirmation)}" onclick="copyConf(this)">${esc(it.confirmation)}</button></div>`:''}
    </div>
    ${it.notes?`<div class="logi-notes">${esc(it.notes)}</div>`:''}
    ${who.length?`<div class="who-row">${who.map(c=>{const p=personFor(c);return `<span class="who-chip" style="border-color:${p.color}80;color:${p.color}">${esc(p.fullName)}</span>`;}).join('')}</div>`:''}
    <div class="logi-actions">
      ${link?`<a class="btn-ghost accent" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">OPEN LINK ↗</a>`:''}
      ${mapsLink?`<a class="btn-ghost accent" href="${mapsLink}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">MAP ↗</a>`:''}
      <button class="btn-ghost" style="border-color:rgba(255,255,255,0.2)" onclick="openLogiForm('${esc(it.id)}')">EDIT</button>
      <button class="btn-ghost" onclick="deleteLogi('${esc(it.id)}')">DELETE</button>
    </div>
  </div>`;
}

function copyConf(btn){
  const val=btn.getAttribute('data-v');
  const done=()=>{ const o=btn.textContent; btn.textContent='COPIED ✓'; setTimeout(()=>{btn.textContent=o;},1200); };
  if(navigator.clipboard) navigator.clipboard.writeText(val).then(done).catch(()=>{});
}

// ---- Add / edit form ----
function openLogiForm(id){
  if(!logiConfigured()) return;
  logiEditingId=id||null;
  logiFormOpen=true;
  renderLogiForm();
  const wrap=document.getElementById('logi-form-wrap');
  if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeLogiForm(){
  logiFormOpen=false; logiEditingId=null;
  const wrap=document.getElementById('logi-form-wrap');
  if(wrap) wrap.innerHTML='';
}
function renderLogiForm(){
  const wrap=document.getElementById('logi-form-wrap');
  if(!wrap) return;
  const it=logiEditingId ? (logiItems.find(x=>x.id===logiEditingId)||{}) : {};
  const type=it.type||'Flight';
  const t=logiType(type);
  const who=whoList(it);
  const v=k=>esc(it[k]||'');
  const dt=k=>{ const p=parseLocal(it[k]); return p?`${p.y}-${String(p.mo).padStart(2,'0')}-${String(p.d).padStart(2,'0')}T${String(p.h==null?0:p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`:''; };
  wrap.innerHTML=`<div class="form-card logi-form">
    <div class="form-label" style="font-size:11px;margin-bottom:14px">${logiEditingId?'EDIT ITEM':'NEW ITEM'}</div>
    <div class="form-row two">
      <div><div class="form-label">Type</div>
        <select id="lf-type" onchange="logiTypeChanged()">${LOGI_TYPES.map(x=>`<option${x.key===type?' selected':''}>${x.key}</option>`).join('')}</select>
      </div>
      <div><div class="form-label">Title</div>
        <input type="text" id="lf-title" value="${v('title')}" placeholder="${esc(t.titlePh)}">
      </div>
    </div>
    <div class="form-row two">
      <div><div class="form-label" id="lf-start-lbl">${t.startLbl} (local time)</div>
        <input type="datetime-local" id="lf-start" value="${dt('start')}">
      </div>
      <div><div class="form-label" id="lf-end-lbl">${t.endLbl} (local time)</div>
        <input type="datetime-local" id="lf-end" value="${dt('end')}">
      </div>
    </div>
    <div class="form-row two">
      <div><div class="form-label" id="lf-loc-lbl">${type==='Flight'?'Route':'Location'}</div>
        <input type="text" id="lf-location" value="${v('location')}" placeholder="${esc(t.locPh)}">
      </div>
      <div><div class="form-label">Confirmation #</div>
        <input type="text" id="lf-conf" value="${v('confirmation')}" autocapitalize="characters" autocomplete="off">
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Who</div>
        <div class="who-pick" id="lf-who">
          <label class="${who.includes('TEAM')?'on':''}"><input type="checkbox" value="TEAM"${who.includes('TEAM')?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">Whole team</label>
          ${ALL_PEOPLE.map(p=>`<label class="${who.includes(p.name)?'on':''}"><input type="checkbox" value="${esc(p.name)}"${who.includes(p.name)?' checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(p.fullName)}</label>`).join('')}
        </div>
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Link (booking, itinerary…)</div>
        <input type="url" id="lf-link" value="${v('link')}" placeholder="https://">
      </div>
    </div>
    <div class="form-row one">
      <div><div class="form-label">Notes</div>
        <textarea id="lf-notes" placeholder="Seats, terminal, who's driving, parking…">${v('notes')}</textarea>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btn" id="lf-save" onclick="saveLogi()">${logiEditingId?'SAVE CHANGES':'ADD'}</button>
      <button class="btn-ghost" onclick="closeLogiForm()">CANCEL</button>
      <span id="logi-msg"></span>
    </div>
  </div>`;
}
function logiTypeChanged(){
  const t=logiType(document.getElementById('lf-type').value);
  document.getElementById('lf-start-lbl').textContent=t.startLbl+' (local time)';
  document.getElementById('lf-end-lbl').textContent=t.endLbl+' (local time)';
  document.getElementById('lf-loc-lbl').textContent=t.key==='Flight'?'Route':'Location';
  document.getElementById('lf-title').placeholder=t.titlePh;
  document.getElementById('lf-location').placeholder=t.locPh;
}
async function saveLogi(){
  const g=id=>document.getElementById(id);
  const msg=g('logi-msg'), btn=g('lf-save');
  const item={
    id: logiEditingId||'',
    type: g('lf-type').value,
    title: g('lf-title').value.trim(),
    start: g('lf-start').value,
    end: g('lf-end').value,
    location: g('lf-location').value.trim(),
    confirmation: g('lf-conf').value.trim(),
    who: Array.from(document.querySelectorAll('#lf-who input:checked')).map(x=>x.value).join(','),
    link: g('lf-link').value.trim(),
    notes: g('lf-notes').value.trim(),
  };
  if(!item.title){ msg.textContent=' ← add a title'; msg.style.color='var(--red)'; return; }
  if(item.start && item.end && item.end<item.start){ msg.textContent=' ← end is before start'; msg.style.color='var(--red)'; return; }
  btn.disabled=true; msg.textContent=' saving…'; msg.style.color='var(--white-dim)';
  try{
    await postLogi({action:'save', item});
    closeLogiForm();
    renderLogiList();
  }catch(err){
    console.error('saveLogi error', err);
    msg.textContent=' ✗ save failed — try again'; msg.style.color='var(--red)';
    btn.disabled=false;
  }
}
async function deleteLogi(id){
  const it=logiItems.find(x=>x.id===id);
  if(!it) return;
  if(!confirm('Delete "'+(it.title||'this item')+'" for everyone?')) return;
  try{
    await postLogi({action:'delete', id});
    if(logiEditingId===id) closeLogiForm();
    renderLogiList();
  }catch(err){
    console.error('deleteLogi error', err);
    alert('Delete failed — try again.');
  }
}
